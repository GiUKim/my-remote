name: 업무용 사용 문의 / Business use
description: 회사에서 쓰시려면 규모와 필요한 기능을 알려 주세요 / Using it at work? Tell us what you need
labels: [business]
body:
  - type: markdown
    attributes:
      value: |
        **이 문의는 공개됩니다.** 접속 키, 회사 내부 정보, 개인 연락처는 적지 마세요. 답은 이 글의 댓글로 드립니다.
        **This inquiry is public.** Do not write access keys, internal company details or personal contact data; we answer in the comments.
  - type: dropdown
    id: size
    attributes:
      label: 쓰려는 PC 수 / Number of PCs
      options: ["1–5", "6–20", "21–100", "100+"]
    validations:
      required: true
  - type: checkboxes
    id: use
    attributes:
      label: 어떻게 쓰시나요? / How would you use it?
      options:
        - label: 직원이 회사 PC에 원격으로 / Staff reaching their office PCs
        - label: 고객 PC 원격 지원 (1회용 코드) / Supporting customers' PCs (one-time codes)
        - label: 서버·장비 관리 / Managing servers and equipment
        - label: 기타 (아래에 적어 주세요) / Other (describe below)
  - type: checkboxes
    id: need
    attributes:
      label: 필요한 기능 / What you need
      options:
        - label: 회사망·방화벽 안에서도 연결 (중계 서버) / Connecting through company networks and firewalls (relay)
        - label: 여러 PC의 기기 목록을 한곳에서 관리 / Managing the devices of many PCs in one place
        - label: 회사 자체 서버 사용 / Running on the company's own server
        - label: macOS 지원 / macOS
        - label: 세금계산서·견적서 / Invoices and quotes
        - label: 우선 지원 / Priority support
  - type: dropdown
    id: price
    attributes:
      label: 업무용이라면 생각하는 비용 (PC 1대, 월) / What you would pay for business use (per PC, per month)
      options: ["무료여야 함 / Must be free", "~3,000원 / ~$2", "3,000–10,000원 / $2–7", "10,000원 이상 / $7+", "모름 / Not sure"]
  - type: textarea
    id: more
    attributes:
      label: 더 알려 주실 것 / Anything else
      description: 지금 쓰는 원격 프로그램과 불편한 점, 꼭 필요한 기능 등 / The remote tool you use now, what bothers you, what you must have
