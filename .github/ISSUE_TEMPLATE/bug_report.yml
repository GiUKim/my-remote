name: 문제 신고
description: 동작하지 않거나 이상하게 동작하는 것을 알려 주세요
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **접속 키는 절대 적지 마세요.** 키를 가진 사람은 그 PC를 조작할 수 있습니다.
        보안 문제(다른 사람이 PC에 들어올 수 있는 문제 등)는 여기에 쓰지 말고 [보안 정책](../security/policy)대로 비공개로 알려 주세요.
  - type: dropdown
    id: role
    attributes:
      label: 어느 쪽에서 생겼나요?
      options: [호스트(조종당하는 PC), 클라이언트(조종하는 PC), 둘 다 / 모름]
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 운영체제
      description: 호스트와 클라이언트 각각 (예 — 호스트 Windows 11, 클라이언트 Ubuntu 24.04)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 버전
      description: 호스트 창 제목 옆의 버전 (예 v0.5.0), 설치형 앱인지 소스 폴더인지
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 무엇을 했고, 무엇이 일어났나요?
      description: 순서대로 적어 주세요. 기대한 동작도 함께.
    validations:
      required: true
  - type: textarea
    id: diag
    attributes:
      label: 진단 보고
      description: 클라이언트 창의 "진단" 버튼이 보여 주는 내용을 붙여 넣어 주세요(키는 들어 있지 않습니다). 끊김·지연 문제라면 꼭 필요합니다.
      render: text
