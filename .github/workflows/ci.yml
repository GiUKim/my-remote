# What every change must pass before it is released (release/build.js refuses a commit whose CI has
# not passed). Jobs: static checks and plain-Node tests; native binaries rebuilt byte for byte; the
# Windows and Linux self-tests and the packaged app; the Android app's build; the performance gate on both.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1' # weekly: a new runner image or Electron patch that breaks something shows up without a commit

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: checks (static, update logic, PC list)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Static checks (syntax, JSON, the loader, names, native records, leaks)
        env:
          PRIVATE_PATTERNS: ${{ secrets.PRIVATE_PATTERNS }} # optional: one regular expression per line, kept out of the repository
        run: node release/ci-run.js node release/ci-checks.js
      - name: Update logic
        run: node release/ci-run.js node release/test-update.js
      - name: The client app's list of PCs
        run: node release/ci-run.js node release/test-hosts.js
      - name: The host's device tokens and access log
        run: node release/ci-run.js node release/test-devices.js
      - name: QR codes and one-time codes (for the opt-in authenticator app)
        run: node release/ci-run.js node release/test-qr.js && node release/ci-run.js node release/test-totp.js
      - name: The client app's check of a host's page (signed by a release), and what release/build.js signs
        run: node release/ci-run.js node release/test-pagecheck.js
      - name: Host and client kept one app (updates followed, the one entry)
        run: node release/ci-run.js node release/test-appsync.js
      - name: The shell replaced by a newer package (signed list, staging, the sh swap script on fake folders)
        run: node release/ci-run.js node release/test-shellswap.js
      - name: The host started again after a crash (the watchdog)
        run: node release/ci-run.js node release/test-watchdog.js
      - name: Connections that come back on themselves (a PC to itself, two PCs controlling each other)
        run: node release/ci-run.js node release/test-cycle.js
      - name: Keyboard Lock without stuck modifier keys (the wrapper, the page's copy, no bare lock)
        run: node release/ci-run.js node release/test-keylock.js
      - name: Whether the Korean keys can work on a host (Linux input methods, Windows' Korean keyboard)
        run: node release/ci-run.js node release/test-imecheck.js
      - name: The languages (every text translated, holes, tags, plurals, quoted names; the translator; the setting)
        run: node release/ci-run.js node release/test-i18n.js
      - name: The check of a signed Pangmote.exe before a package takes it (the byte rules)
        run: node release/ci-run.js node release/test-signed-exe.js
      - name: The README's picture and badge of the sponsors (public only, avatars from GitHub only, escaped, the key)
        run: node release/ci-run.js node release/test-sponsors.js

  native:
    name: native binaries rebuilt byte for byte
    runs-on: ubuntu-22.04 # the build server's distribution: the same mingw-w64 (GCC 10-win32 20220113)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install mingw-w64
        run: sudo apt-get update -q && sudo apt-get install -y -q mingw-w64
      - name: Rebuild host/bin from native/ and compare
        run: node release/ci-run.js node release/ci-native.js

  android:
    # The Android app (android/, from 2026-11-26): it builds, as a test APK and as the bundle Google Play takes. The
    # runner image has the Android SDK and Java 21; Gradle comes from its own site, checked against its SHA-256. The
    # test APK is kept as an artifact for two weeks (a phone can install it from there).
    name: Android app (builds)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Gradle (its published SHA-256 checked)
        run: |
          v=9.9.2
          curl -sfL -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-$v-bin.zip"
          echo "$(curl -sfL "https://services.gradle.org/distributions/gradle-$v-bin.zip.sha256")  /tmp/gradle.zip" | sha256sum -c -
          unzip -q /tmp/gradle.zip -d /tmp && mv "/tmp/gradle-$v" /tmp/gradle
      - name: Build the test APK and the release bundle, and lint (an error fails the job)
        working-directory: android
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          /tmp/gradle/bin/gradle assembleDebug bundleRelease lintDebug --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: pangmote-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  windows:
    name: Windows (assist protocol, self-test, packaged app)
    runs-on: windows-2022
    timeout-minutes: 30
    needs: checks
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: host/package-lock.json
      - name: Install (npm ci, then Electron itself)
        working-directory: host
        run: |
          npm ci
          node node_modules/electron/install.js
      - name: Assist service protocol (fake service, no input)
        run: node release/ci-run.js node release/test-assist.js
      - name: The check of a signed Pangmote.exe (with Windows' own Authenticode verdict, on node.exe's real signature)
        run: node release/ci-run.js node release/test-signed-exe.js
      - name: The shell replaced by a newer package (the PowerShell swap script on fake folders)
        run: node release/ci-run.js node release/test-shellswap.js
      - name: The host started again after a crash (the watchdog)
        run: node release/ci-run.js node release/test-watchdog.js
      - name: Self-test (with the client app, its list of PCs and device tokens)
        working-directory: host
        run: node ../release/ci-run.js node_modules/electron/dist/electron.exe . --selftest --client-app-check
      - name: Packaged app through the update shell
        run: node release/ci-run.js node release/test-app.js --packaged

  linux:
    name: Linux X11 (self-test with input, clipboard, client app; packaged app)
    runs-on: ubuntu-22.04 # 24.04 restricts the user namespaces Chromium's sandbox needs
    timeout-minutes: 30
    needs: checks
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: host/package-lock.json
      - name: Desktop libraries and a virtual display
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb libgtk-3-0 libnss3 libgbm1 libasound2 libxss1 libxtst6 libxdamage1 libxfixes3
      - name: Install (npm ci, then Electron itself)
        working-directory: host
        run: |
          npm ci
          node node_modules/electron/install.js
      - name: Self-test with real input on the virtual display
        working-directory: host
        run: node ../release/ci-run.js xvfb-run -a -s "-screen 0 1920x1080x24" node_modules/electron/dist/electron . --selftest --input-check --clip-check --client-app-check
      - name: Packaged app through the update shell
        run: node release/ci-run.js xvfb-run -a -s "-screen 0 1920x1080x24" node release/test-app.js --packaged

  soak:
    # Weekly and by hand only (ten minutes each): a long session that reconnects every minute fails when
    # what each session leaves behind grows past 2 MB (see --soak in CLAUDE.md). Leaks show up over time.
    name: soak (${{ matrix.os }}, weekly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [windows, linux]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: host/package-lock.json
      - name: Desktop libraries and a virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb libgtk-3-0 libnss3 libgbm1 libasound2 libxss1 libxtst6 libxdamage1 libxfixes3
      - name: Install (npm ci, then Electron itself)
        working-directory: host
        run: |
          npm ci
          node node_modules/electron/install.js
      - name: Ten minutes of reconnecting sessions
        working-directory: host
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then node ../release/ci-run.js xvfb-run -a -s "-screen 0 1920x1080x24" node_modules/electron/dist/electron . --selftest --soak=10
          else node ../release/ci-run.js node_modules/electron/dist/electron.exe . --selftest --soak=10; fi

  bench:
    name: performance gate (${{ matrix.os }})
    needs: [windows, linux]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: host/package-lock.json
      - name: Desktop libraries and a virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb libgtk-3-0 libnss3 libgbm1 libasound2 libxss1 libxtst6 libxdamage1 libxfixes3
      - name: Install (npm ci, then Electron itself)
        working-directory: host
        run: |
          npm ci
          node node_modules/electron/install.js
      - name: Bench within the CI limits (release/bench-thresholds.json)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then node release/ci-run.js xvfb-run -a -s "-screen 0 1920x1080x24" node release/bench-gate.js --profile=ci
          else node release/ci-run.js node release/bench-gate.js --profile=ci; fi
