<svg xmlns="http://www.w3.org/2000/svg" width="420" height="260" viewBox="0 0 420 260" font-family='"Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif'>
  <title>모니터 배치</title>
  <defs>
    <g id="stand">
      <rect x="-6" y="0" width="12" height="8" fill="#39424e"/>
      <rect x="-19" y="7" width="38" height="4" rx="2" fill="#39424e"/>
    </g>
  </defs>
  <rect width="420" height="260" rx="18" fill="#14171c"/>
  <rect x="1" y="1" width="418" height="258" rx="17" fill="none" stroke="#2c333d" stroke-width="2"/>

  <text x="24" y="32" font-size="17" fill="#8b97a6">호스트 PC</text>
  <!-- host 1 -->
  <rect x="44" y="44" width="92" height="58" rx="6" fill="#1e3152" stroke="#4a8dff" stroke-width="2.5"/>
  <use href="#stand" x="90" y="103"/>
  <circle cx="61" cy="61" r="11" fill="#4a8dff"/>
  <text x="61" y="66" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <!-- host 2 -->
  <rect x="164" y="44" width="92" height="58" rx="6" fill="#1b3a34" stroke="#3ecf8e" stroke-width="2.5"/>
  <use href="#stand" x="210" y="103"/>
  <circle cx="181" cy="61" r="11" fill="#3ecf8e"/>
  <text x="181" y="66" font-size="13" font-weight="700" fill="#14171c" text-anchor="middle">2</text>
  <!-- host 3: not shown anywhere -->
  <rect x="284" y="44" width="92" height="58" rx="6" fill="#1d2229" stroke="#5b6573" stroke-width="2" stroke-dasharray="5 5"/>
  <use href="#stand" x="330" y="103" opacity="0.6"/>
  <circle cx="301" cy="61" r="11" fill="#5b6573"/>
  <text x="301" y="66" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text>

  <!-- which is shown where -->
  <path d="M90 116 C90 136 138 130 138 150" fill="none" stroke="#4a8dff" stroke-width="3" stroke-linecap="round"/>
  <path d="M210 116 C210 136 282 130 282 150" fill="none" stroke="#3ecf8e" stroke-width="3" stroke-linecap="round"/>

  <text x="22" y="197" font-size="17" fill="#8b97a6">이 PC</text>
  <!-- this PC, screen A -->
  <rect x="76" y="152" width="124" height="76" rx="7" fill="#1e3152" stroke="#4a8dff" stroke-width="2.5"/>
  <use href="#stand" x="138" y="229"/>
  <rect x="88" y="164" width="58" height="38" rx="3" fill="#e6e8eb"/>
  <rect x="88" y="164" width="58" height="9" rx="3" fill="#4a8dff"/>
  <circle cx="183" cy="169" r="10" fill="#4a8dff"/>
  <text x="183" y="174" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <!-- this PC, screen B -->
  <rect x="220" y="152" width="124" height="76" rx="7" fill="#1b3a34" stroke="#3ecf8e" stroke-width="2.5"/>
  <use href="#stand" x="282" y="229"/>
  <g fill="#3ecf8e">
    <rect x="234" y="196" width="12" height="20" rx="2"/><rect x="252" y="184" width="12" height="32" rx="2"/><rect x="270" y="190" width="12" height="26" rx="2"/><rect x="288" y="176" width="12" height="40" rx="2"/>
  </g>
  <circle cx="327" cy="169" r="10" fill="#3ecf8e"/>
  <text x="327" y="174" font-size="12" font-weight="700" fill="#14171c" text-anchor="middle">2</text>
</svg>
