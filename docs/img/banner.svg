<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" font-family='"Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif'>
  <title>My Remote</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20262f"/>
      <stop offset="1" stop-color="#14171c"/>
    </linearGradient>
    <g id="mon">
      <rect width="118" height="76" rx="7" fill="#0e1014" stroke="#3a4350" stroke-width="2"/>
      <rect x="52" y="77" width="14" height="10" fill="#39424e"/>
      <rect x="35" y="86" width="48" height="5" rx="2.5" fill="#39424e"/>
    </g>
    <g id="scrA">
      <rect x="5" y="5" width="108" height="66" rx="3" fill="#1e3152"/>
      <rect x="14" y="14" width="62" height="44" rx="3" fill="#e6e8eb"/>
      <rect x="14" y="14" width="62" height="10" rx="3" fill="#4a8dff"/>
      <rect x="20" y="30" width="40" height="4" rx="2" fill="#9aa7b8"/>
      <rect x="20" y="38" width="50" height="4" rx="2" fill="#c3ccd8"/>
      <rect x="20" y="46" width="30" height="4" rx="2" fill="#c3ccd8"/>
      <rect x="84" y="18" width="22" height="16" rx="2" fill="#35548a"/>
      <rect x="84" y="40" width="22" height="16" rx="2" fill="#35548a"/>
    </g>
    <g id="scrB">
      <rect x="5" y="5" width="108" height="66" rx="3" fill="#1b3a34"/>
      <rect x="16" y="46" width="12" height="16" rx="2" fill="#3ecf8e"/>
      <rect x="34" y="36" width="12" height="26" rx="2" fill="#3ecf8e"/>
      <rect x="52" y="42" width="12" height="20" rx="2" fill="#3ecf8e"/>
      <rect x="70" y="26" width="12" height="36" rx="2" fill="#3ecf8e"/>
      <rect x="88" y="32" width="12" height="30" rx="2" fill="#3ecf8e"/>
      <path d="M16 30 L40 20 L58 27 L76 13 L100 18" fill="none" stroke="#e6e8eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect width="1200" height="340" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="338" rx="27" fill="none" stroke="#2c333d" stroke-width="2"/>
  <circle cx="876" cy="150" r="230" fill="#4a8dff" opacity="0.06"/>

  <!-- the name -->
  <g transform="translate(72 80)">
    <rect width="88" height="88" rx="18" fill="#2b6cff"/>
    <rect x="15" y="20" width="58" height="38" rx="5" fill="#fff"/>
    <rect x="37" y="58" width="14" height="8" fill="#fff"/>
    <rect x="27" y="65" width="34" height="6" rx="3" fill="#fff"/>
  </g>
  <text x="184" y="147" font-size="64" font-weight="700" fill="#e6e8eb">My Remote</text>
  <text x="74" y="226" font-size="27" fill="#aeb9c6">다른 곳에 있는 내 PC를,</text>
  <text x="74" y="264" font-size="27" fill="#aeb9c6">그 앞에 앉은 것처럼.</text>

  <!-- this PC: the same two screens -->
  <use href="#mon" x="590" y="104"/>
  <use href="#scrA" x="590" y="104"/>
  <use href="#mon" x="716" y="104"/>
  <use href="#scrB" x="716" y="104"/>
  <path d="M664 148 l0 17 l4.6 -4.2 l3.2 7.4 l2.8 -1.2 l-3.2 -7.2 l6.2 0 z" fill="#fff" stroke="#14171c" stroke-width="1.2" stroke-linejoin="round"/>
  <text x="712" y="230" font-size="19" fill="#8b97a6" text-anchor="middle">이 PC</text>

  <!-- the link: direct, encrypted -->
  <path d="M842 142 H856 M896 142 H910" stroke="#4a8dff" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="1 7"/>
  <circle cx="876" cy="142" r="20" fill="#14171c" stroke="#4a8dff" stroke-width="2.5"/>
  <rect x="867.5" y="140" width="17" height="13" rx="2.5" fill="#4a8dff"/>
  <path d="M871 140 v-4 a5 5 0 0 1 10 0 v4" fill="none" stroke="#4a8dff" stroke-width="2.6"/>

  <!-- the host PC -->
  <use href="#mon" x="916" y="104"/>
  <use href="#scrA" x="916" y="104"/>
  <use href="#mon" x="1042" y="104"/>
  <use href="#scrB" x="1042" y="104"/>
  <text x="1038" y="230" font-size="19" fill="#8b97a6" text-anchor="middle">호스트 PC</text>
</svg>
