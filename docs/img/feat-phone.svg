<svg xmlns="http://www.w3.org/2000/svg" width="420" height="260" viewBox="0 0 420 260" font-family='"Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif'>
  <title>휴대폰과 태블릿</title>
  <rect width="420" height="260" rx="18" fill="#14171c"/>
  <rect x="1" y="1" width="418" height="258" rx="17" fill="none" stroke="#2c333d" stroke-width="2"/>

  <!-- a phone held sideways, the host's screen on it -->
  <rect x="58" y="46" width="304" height="168" rx="24" fill="#0e1014" stroke="#3a4350" stroke-width="2.5"/>
  <rect x="84" y="60" width="252" height="140" rx="6" fill="#1e3152"/>
  <rect x="70" y="118" width="5" height="24" rx="2.5" fill="#3a4350"/>
  <circle cx="349" cy="130" r="4" fill="#3a4350"/>
  <!-- what is on the host -->
  <rect x="100" y="76" width="118" height="78" rx="4" fill="#e6e8eb"/>
  <rect x="100" y="76" width="118" height="12" rx="4" fill="#4a8dff"/>
  <path d="M110 102 h80 M110 114 h96 M110 126 h60 M110 138 h84" stroke="#aeb9c6" stroke-width="4" stroke-linecap="round"/>
  <rect x="232" y="82" width="88" height="52" rx="4" fill="#35548a"/>
  <rect x="84" y="186" width="252" height="14" fill="#182743"/>
  <g fill="#4a8dff"><rect x="92" y="189" width="9" height="8" rx="1.5"/><rect x="106" y="189" width="9" height="8" rx="1.5"/><rect x="120" y="189" width="9" height="8" rx="1.5"/></g>

  <!-- a tap -->
  <circle cx="162" cy="120" r="26" fill="none" stroke="#4a8dff" stroke-width="2" opacity="0.35"/>
  <circle cx="162" cy="120" r="17" fill="none" stroke="#4a8dff" stroke-width="2.5" opacity="0.7"/>
  <circle cx="162" cy="120" r="9" fill="#4a8dff"/>

  <!-- two fingers: larger -->
  <circle cx="258" cy="96" r="8" fill="#3ecf8e"/>
  <circle cx="296" cy="134" r="8" fill="#3ecf8e"/>
  <path d="M250 88 l-10 -10 M240 78 h9 M240 78 v9" fill="none" stroke="#3ecf8e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M304 142 l10 10 M314 152 h-9 M314 152 v-9" fill="none" stroke="#3ecf8e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
