<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" font-family='"Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif'>
  <title>3단계로 시작</title>
  <defs>
    <g id="card">
      <rect width="364" height="250" rx="18" fill="#1d2229" stroke="#2c333d" stroke-width="2"/>
      <circle cx="44" cy="46" r="22" fill="#2b6cff"/>
    </g>
    <g id="mon">
      <rect width="120" height="78" rx="7" fill="#0e1014" stroke="#3a4350" stroke-width="2"/>
      <rect x="5" y="5" width="110" height="68" rx="3" fill="#1e3152"/>
      <rect x="53" y="79" width="14" height="9" fill="#39424e"/>
      <rect x="36" y="87" width="48" height="5" rx="2.5" fill="#39424e"/>
      <circle cx="60" cy="39" r="21" fill="#2b6cff"/>
      <path d="M60 27 V46 M51 39 L60 48 L69 39" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="win">
      <rect width="276" height="136" rx="10" fill="#14171c" stroke="#3a4350" stroke-width="2"/>
      <path d="M10 1 h256 a9 9 0 0 1 9 9 v14 H1 V10 a9 9 0 0 1 9 -9 z" fill="#232a33"/>
      <circle cx="16" cy="13" r="4" fill="#5b6573"/>
      <circle cx="30" cy="13" r="4" fill="#5b6573"/>
    </g>
  </defs>

  <rect width="1200" height="290" rx="24" fill="#14171c"/>

  <!-- 1 -->
  <use href="#card" x="24" y="20"/>
  <text x="68" y="74" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="104" y="75" font-size="25" font-weight="700" fill="#e6e8eb">두 PC에 설치</text>
  <use href="#mon" x="64" y="112"/>
  <use href="#mon" x="228" y="112"/>
  <text x="124" y="232" font-size="17" fill="#8b97a6" text-anchor="middle">호스트</text>
  <text x="288" y="232" font-size="17" fill="#8b97a6" text-anchor="middle">클라이언트</text>

  <path d="M397 136 l12 9 l-12 9" fill="none" stroke="#4a8dff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 2 -->
  <use href="#card" x="418" y="20"/>
  <text x="462" y="74" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="498" y="75" font-size="25" font-weight="700" fill="#e6e8eb">호스트에서 키 복사</text>
  <use href="#win" x="462" y="108"/>
  <circle cx="486" cy="156" r="7" fill="#3ecf8e"/>
  <rect x="502" y="151" width="84" height="10" rx="5" fill="#3a4350"/>
  <circle cx="490" cy="206" r="10" fill="none" stroke="#e0b341" stroke-width="4.5"/>
  <path d="M500 206 H534 M522 206 v9 M531 206 v7" fill="none" stroke="#e0b341" stroke-width="4.5" stroke-linecap="round"/>
  <g fill="#8b97a6">
    <circle cx="552" cy="206" r="3.5"/><circle cx="565" cy="206" r="3.5"/><circle cx="578" cy="206" r="3.5"/><circle cx="591" cy="206" r="3.5"/>
  </g>
  <rect x="612" y="186" width="108" height="40" rx="8" fill="#2b6cff"/>
  <text x="666" y="212" font-size="18" font-weight="600" fill="#fff" text-anchor="middle">키 복사</text>

  <path d="M791 136 l12 9 l-12 9" fill="none" stroke="#4a8dff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 3 -->
  <use href="#card" x="812" y="20"/>
  <text x="856" y="74" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="892" y="75" font-size="25" font-weight="700" fill="#e6e8eb">클라이언트에서 접속</text>
  <use href="#win" x="856" y="108"/>
  <rect x="874" y="146" width="160" height="40" rx="8" fill="#0e1014" stroke="#3a4350" stroke-width="2"/>
  <g fill="#e6e8eb">
    <circle cx="892" cy="166" r="3.5"/><circle cx="906" cy="166" r="3.5"/><circle cx="920" cy="166" r="3.5"/><circle cx="934" cy="166" r="3.5"/>
    <circle cx="948" cy="166" r="3.5"/><circle cx="962" cy="166" r="3.5"/><circle cx="976" cy="166" r="3.5"/><circle cx="990" cy="166" r="3.5"/>
  </g>
  <rect x="1044" y="146" width="72" height="40" rx="8" fill="#2b6cff"/>
  <text x="1080" y="172" font-size="18" font-weight="600" fill="#fff" text-anchor="middle">접속</text>
  <circle cx="886" cy="216" r="10" fill="#3ecf8e"/>
  <path d="M881 216 l4 4 l7 -8" fill="none" stroke="#14171c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#24406e" stroke="#4a8dff" stroke-width="1.5">
    <rect x="908" y="204" width="38" height="24" rx="3"/><rect x="954" y="204" width="38" height="24" rx="3"/><rect x="1000" y="204" width="38" height="24" rx="3"/>
  </g>
</svg>
