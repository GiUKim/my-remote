<svg xmlns="http://www.w3.org/2000/svg" width="420" height="260" viewBox="0 0 420 260" font-family='"Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif'>
  <title>잠금 화면에서도 원격 조종</title>
  <rect width="420" height="260" rx="18" fill="#14171c"/>
  <rect x="1" y="1" width="418" height="258" rx="17" fill="none" stroke="#2c333d" stroke-width="2"/>

  <!-- the client's window showing the host's lock screen -->
  <rect x="36" y="28" width="348" height="164" rx="10" fill="#1d2229" stroke="#4a8dff" stroke-width="2"/>
  <rect x="45" y="37" width="330" height="146" rx="6" fill="#22344d"/>
  <path d="M45 150 L112 108 L158 132 L222 94 L290 128 L375 102 L375 177 Q375 183 369 183 L51 183 Q45 183 45 177 Z" fill="#2d4a3b"/>

  <!-- the bar the client shows over the lock screen -->
  <rect x="88" y="45" width="244" height="26" rx="7" fill="#14171c" stroke="#3a4350"/>
  <g transform="translate(103 58)" fill="none" stroke="#e0b341" stroke-width="2" stroke-linejoin="round">
    <rect x="-6" y="-2" width="12" height="9" rx="2" fill="#e0b341"/>
    <path d="M-4 -2 v-3 a4 4 0 0 1 8 0 v3"/>
  </g>
  <text x="116" y="63" font-size="12.5" fill="#e6e8eb">호스트 잠금 화면</text>
  <rect x="248" y="49" width="78" height="18" rx="5" fill="#343c48"/>
  <text x="287" y="62" font-size="11" fill="#fff" text-anchor="middle">Ctrl+Alt+Del</text>

  <!-- the sign-in: who, and the password being typed -->
  <circle cx="210" cy="102" r="15" fill="#cfd6df" opacity=".9"/>
  <circle cx="210" cy="98" r="5" fill="#6b7685"/>
  <path d="M201 112 a9 7 0 0 1 18 0" fill="#6b7685"/>
  <rect x="146" y="128" width="110" height="22" rx="3" fill="#f4f6f8"/>
  <g fill="#14171c"><circle cx="157" cy="139" r="3"/><circle cx="167" cy="139" r="3"/><circle cx="177" cy="139" r="3"/><circle cx="187" cy="139" r="3"/><circle cx="197" cy="139" r="3"/><circle cx="207" cy="139" r="3"/></g>
  <rect x="211" y="132" width="1.6" height="14" fill="#14171c"/>
  <rect x="256" y="128" width="22" height="22" fill="#3a4350"/>
  <path d="M262 139 h10 m-4 -4 l4 4 l-4 4" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- and it opens -->
  <g transform="translate(118 223)" fill="none" stroke="#3ecf8e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <rect x="-11" y="-6" width="22" height="16" rx="3" fill="#1b3a34"/>
    <path d="M-7 -6 v-6 a7 7 0 0 1 13 -3"/>
  </g>
  <text x="140" y="229" font-size="17" fill="#cfd6df">비밀번호로 원격 잠금 해제</text>
</svg>
