<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pangmote</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { font: 16px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif; background: #14171c; color: #e6e8eb; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 10px; padding: 18px 18px 8px; font-size: 20px; font-weight: 700; }
  header svg { width: 30px; height: 30px; flex: none; }
  header small { font-size: 12px; font-weight: 400; color: #8b94a1; }
  main { flex: 1; overflow-y: auto; padding: 8px 14px 16px; }
  .pc { display: flex; align-items: center; gap: 12px; background: #1d2229; border: 1px solid #2c333d; border-radius: 14px; padding: 14px 10px 14px 16px; margin-bottom: 10px; }
  .pc:active { background: #232a33; }
  .pc .os { width: 38px; height: 38px; border-radius: 10px; background: #2b6cff22; color: #7fb0ff; display: grid; place-items: center; font-size: 13px; font-weight: 700; flex: none; }
  .pc .txt { flex: 1; min-width: 0; }
  .pc .name { font-size: 17px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pc .sub { font-size: 13px; color: #8b94a1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pc .more { background: none; border: 0; color: #aab2bd; font-size: 22px; width: 44px; height: 44px; border-radius: 22px; flex: none; }
  .pc .more:active { background: #2c333d; }
  #empty { text-align: center; color: #aab2bd; padding: 40px 24px 0; display: none; }
  #empty b { display: block; color: #e6e8eb; font-size: 18px; margin-bottom: 8px; }
  :lang(ko) body { word-break: keep-all; overflow-wrap: anywhere; } /* Korean breaks between words, not inside them */
  footer { padding: 12px 16px calc(18px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; }
  button.primary { font: inherit; font-size: 17px; font-weight: 600; background: #2b6cff; color: #fff; border: 0; border-radius: 14px; padding: 15px; }
  button.sub { font: inherit; background: #262c35; color: #e6e8eb; border: 0; border-radius: 12px; padding: 12px; }
  button:active { filter: brightness(1.15); }
  #lic { text-align: center; font-size: 12px; color: #6f7884; text-decoration: none; padding-top: 2px; }
  /* sheets and questions of our own (no browser dialogs) */
  #veil { position: fixed; inset: 0; background: #0008; display: none; align-items: flex-end; justify-content: center; }
  #sheet { width: 100%; max-width: 560px; background: #1d2229; border-radius: 18px 18px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; }
  #sheet p { margin: 0 0 4px; color: #c5ccd6; }
  #sheet input { font: inherit; font-size: 17px; background: #0e1014; color: #fff; border: 1px solid #3a4350; border-radius: 10px; padding: 10px 12px; }
  #sheet .row { display: flex; gap: 10px; }
  #sheet .row button { flex: 1; }
  button.danger { font: inherit; background: #5a1f1f; color: #ffb4b4; border: 0; border-radius: 12px; padding: 12px; }
</style>
</head>
<body>
<header><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="2" y="2" width="60" height="60" rx="11" fill="#2b6cff"/><rect x="12" y="15" width="40" height="27" rx="3" fill="#fff"/><rect x="27" y="42" width="10" height="5" fill="#fff"/><rect x="20" y="47" width="24" height="4" rx="2" fill="#fff"/></svg><span>Pangmote</span><small id="ver"></small></header>
<main><div id="list"></div><div id="empty"><b id="emptyT"></b><span id="emptyHow"></span></div></main>
<footer>
  <button id="scan" class="primary"></button>
  <button id="key" class="sub"></button>
  <a id="lic" href="licenses.html"></a>
</footer>
<div id="veil"><div id="sheet"></div></div>
<script>
// The app's list of PCs (window.mrApp, MainActivity.HomeBridge): names and what the PCs said they are; the tokens stay in
// the app. A PC is added with the QR code of its host window's card "휴대폰 추가".
(function () {
  'use strict';
  var A = window.mrApp;
  var $ = function (id) { return document.getElementById(id); };
  var S = {};
  try { S = JSON.parse(A.strings()); } catch (e) {}
  var T = function (k, a) { return String(S[k] || k).replace('{0}', a == null ? '' : a); };
  var lang = 'en';
  try { lang = A.lang() || 'en'; } catch (e) {}
  document.documentElement.lang = lang;
  try { $('ver').textContent = 'v' + A.version(); } catch (e) {}
  $('scan').textContent = '📷  ' + T('scan');
  $('key').textContent = T('key');
  $('lic').textContent = T('licenses');
  $('emptyT').textContent = T('empty');
  $('emptyHow').textContent = T('how');
  $('scan').onclick = function () { A.scan(); };
  $('key').onclick = function () { A.withKey(); };

  var OS = { windows: 'Win', linux: 'Linux', mac: 'Mac', android: 'And' };
  function ago(t) {
    if (!t) return T('never');
    var s = (t - Date.now()) / 1000, rt;
    try { rt = new Intl.RelativeTimeFormat(lang, { numeric: 'auto' }); } catch (e) { return new Date(t).toLocaleString(); }
    var a = Math.abs(s);
    var v = a < 60 ? rt.format(Math.round(s), 'second') : a < 3600 ? rt.format(Math.round(s / 60), 'minute') : a < 86400 ? rt.format(Math.round(s / 3600), 'hour') : rt.format(Math.round(s / 86400), 'day');
    return T('last', v);
  }
  function sheet(build) {
    var sh = $('sheet');
    sh.textContent = '';
    build(sh);
    $('veil').style.display = 'flex';
  }
  function closeSheet() { $('veil').style.display = 'none'; $('sheet').textContent = ''; }
  $('veil').onclick = function (e) { if (e.target === $('veil')) closeSheet(); };
  function btn(text, cls, fn) { var b = document.createElement('button'); b.className = cls; b.textContent = text; b.onclick = fn; return b; }
  function more(pc) {
    var name = pc.name || pc.pc || '?';
    sheet(function (sh) {
      var p = document.createElement('p'); p.textContent = name; sh.appendChild(p);
      sh.appendChild(btn(T('rename'), 'sub', function () { rename(pc); }));
      sh.appendChild(btn(T('remove'), 'danger', function () { remove(pc); }));
      sh.appendChild(btn(T('cancel'), 'sub', closeSheet));
    });
  }
  function rename(pc) {
    sheet(function (sh) {
      var p = document.createElement('p'); p.textContent = T('rename'); sh.appendChild(p);
      var inp = document.createElement('input'); inp.value = pc.name || pc.pc || ''; inp.maxLength = 60; sh.appendChild(inp);
      var row = document.createElement('div'); row.className = 'row';
      row.appendChild(btn(T('cancel'), 'sub', closeSheet));
      row.appendChild(btn(T('ok'), 'primary', function () { if (inp.value.trim()) A.rename(pc.id, inp.value.trim()); closeSheet(); refresh(); }));
      sh.appendChild(row);
      setTimeout(function () { inp.focus(); inp.select(); }, 50);
    });
  }
  function remove(pc) {
    sheet(function (sh) {
      var p = document.createElement('p'); p.textContent = T('removeQ', pc.name || pc.pc || '?'); sh.appendChild(p);
      var row = document.createElement('div'); row.className = 'row';
      row.appendChild(btn(T('cancel'), 'sub', closeSheet));
      row.appendChild(btn(T('remove'), 'danger', function () { A.remove(pc.id); closeSheet(); refresh(); }));
      sh.appendChild(row);
    });
  }
  window.refresh = function () {
    var list = [];
    try { list = JSON.parse(A.list()); } catch (e) {}
    list.sort(function (a, b) { return (b.lastAt || 0) - (a.lastAt || 0); });
    var box = $('list');
    box.textContent = '';
    $('empty').style.display = list.length ? 'none' : 'block';
    list.forEach(function (pc) {
      var row = document.createElement('div'); row.className = 'pc';
      var os = document.createElement('div'); os.className = 'os'; os.textContent = OS[pc.os] || 'PC';
      var txt = document.createElement('div'); txt.className = 'txt';
      var n = document.createElement('div'); n.className = 'name'; n.textContent = pc.name || pc.pc || '?';
      var s = document.createElement('div'); s.className = 'sub'; s.textContent = [pc.osName, ago(pc.lastAt)].filter(Boolean).join(' · ');
      txt.appendChild(n); txt.appendChild(s);
      var m = document.createElement('button'); m.className = 'more'; m.textContent = '⋮';
      m.onclick = function (e) { e.stopPropagation(); more(pc); };
      row.appendChild(os); row.appendChild(txt); row.appendChild(m);
      row.onclick = function () { A.open(pc.id); };
      box.appendChild(row);
    });
  };
  refresh();
})();
</script>
</body>
</html>
