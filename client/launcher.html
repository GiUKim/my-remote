<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>My Remote</title>
<style>
  :root { --bg: #14171c; --panel: #1d2229; --panel2: #232a33; --line: #2c333d; --line2: #3a4350; --text: #e6e8eb; --muted: #8b94a1; --blue: #2b6cff; --blue2: #4a8dff; --green: #3ddc84; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; user-select: none; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 14px; padding: 20px 26px 6px; }
  .logo { flex: none; width: 40px; height: 40px; border-radius: 10px; background: var(--blue); display: grid; place-items: center; }
  .logo svg { width: 25px; height: 25px; }
  .title b { font-size: 19px; }
  #ver { margin-left: 8px; color: var(--muted); font-size: 13px; }
  .title small { display: block; color: var(--muted); font-size: 13px; }
  main { flex: 1 1 auto; display: flex; gap: 18px; padding: 18px 26px; min-height: 0; overflow: auto; }
  .big { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 22px 18px;
    font: inherit; color: inherit; text-align: center; cursor: pointer; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; transition: background .12s, border-color .12s, transform .12s; }
  .big:hover { background: var(--panel2); border-color: var(--blue2); transform: translateY(-1px); }
  .big:focus-visible { outline: 2px solid var(--blue2); outline-offset: 3px; }
  .big:active { transform: none; }
  .big svg { width: 96px; height: 76px; margin-bottom: 8px; }
  .big b { font-size: 21px; }
  .tag { display: inline-block; padding: 1px 10px; border-radius: 99px; background: #2a313b; color: #c5ccd6; font-size: 12.5px; }
  .big small { color: var(--muted); font-size: 13px; max-width: 250px; }
  .state { min-height: 1.5em; color: var(--green); font-size: 12.5px; }
  footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 26px 18px; color: var(--muted); font-size: 12.5px; }
  footer label { display: flex; align-items: center; gap: 7px; cursor: pointer; }
  body.busy .big { pointer-events: none; opacity: .6; }
  @media (max-width: 560px) { main { flex-direction: column; } .big svg { width: 72px; height: 56px; } }
</style>
</head>
<body>
<header>
  <div class="logo"><svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="12" rx="2" fill="#fff"/><path d="M8.5 20h7M12 16.5V20" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></div>
  <div class="title"><b>My Remote</b><span id="ver"></span><small>무엇을 할까요?</small></div>
</header>
<main>
  <button id="host" class="big" title="1">
    <svg viewBox="0 0 96 76"><rect x="16" y="10" width="64" height="44" rx="6" fill="#1a2433" stroke="#4a8dff" stroke-width="3"/><path d="M38 66h20M48 54v12" stroke="#4a8dff" stroke-width="4" stroke-linecap="round"/><path d="M48 42V22m-8 8 8-8 8 8" fill="none" stroke="#3ddc84" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <b>이 PC 공유</b>
    <span class="tag">호스트</span>
    <small>다른 PC에서 이 PC를 원격으로 조종합니다. 접속 키는 여기서 복사합니다.</small>
    <span class="state" id="hostState"></span>
  </button>
  <button id="client" class="big" title="2">
    <svg viewBox="0 0 96 76"><rect x="6" y="18" width="40" height="28" rx="4" fill="#1a2433" stroke="#8b94a1" stroke-width="3"/><path d="M18 56h16M26 46v10" stroke="#8b94a1" stroke-width="3" stroke-linecap="round"/><rect x="54" y="10" width="38" height="26" rx="4" fill="#1a2433" stroke="#4a8dff" stroke-width="3"/><path d="M66 46h14M73 36v10" stroke="#4a8dff" stroke-width="3" stroke-linecap="round"/><path d="M40 62c14 6 30 0 34-14m-7 3 7-3 2 7" fill="none" stroke="#3ddc84" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <b>다른 PC에 접속</b>
    <span class="tag">클라이언트</span>
    <small>등록한 PC를 골라 원격으로 조종합니다. 여러 대를 동시에 열 수 있습니다.</small>
    <span class="state"></span>
  </button>
</main>
<footer>
  <span>둘 다 쓰려면 MyRemote를 한 번 더 실행해 다른 쪽을 고르면 됩니다.</span>
  <label id="scRow" hidden><input type="checkbox" id="sc" checked><span id="scText">시작 메뉴에 MyRemote 바로가기 만들기</span></label>
</footer>
<script>
const api = window.mrStart, $ = (id) => document.getElementById(id);
let chosen = false;
async function go(what) {
  if (chosen) return;
  chosen = true;
  document.body.classList.add('busy');
  const ok = await api.choose(what, { shortcut: !$('scRow').hidden && $('sc').checked }).catch(() => false);
  if (!ok) { chosen = false; document.body.classList.remove('busy'); }
}
$('host').onclick = () => go('host');
$('client').onclick = () => go('client');
addEventListener('keydown', (e) => { if (e.key === '1') go('host'); else if (e.key === '2') go('client'); });
(async () => {
  const i = (await api.info().catch(() => null)) || {};
  if (i.version) { $('ver').textContent = 'v' + i.version; document.title = 'My Remote v' + i.version; }
  if (i.host && i.host.running) $('hostState').textContent = '● 켜져 있음' + (i.host.version ? ` (v${i.host.version})` : '') + ' — 누르면 창이 열립니다';
  if (i.shortcut && i.shortcut.can && !i.shortcut.has) {
    $('scRow').hidden = false;
    if (i.shortcut.where) $('scText').textContent = `${i.shortcut.where}에 MyRemote 바로가기 만들기`;
  }
})();
</script>
</body>
</html>
