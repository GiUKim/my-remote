,"이 PC는 호스트에서 차단되었습니다. 호스트 PC의 \"접속한 기기\"에서 차단을 풀 수 있습니다.":{"en":"This PC is blocked on the host. It can be unblocked under “Registered devices” on the host PC.","ja":"このPCはホストでブロックされています。ホストPCの「登録済みデバイス」でブロックを解除できます。","zh-CN":"本机已被主机阻止。可以在主机电脑的“已注册设备”中解除阻止。","zh-TW":"本機已被主機封鎖。可以在主機電腦的「已註冊裝置」中解除封鎖。","es":"Este PC está bloqueado en el host. Se puede desbloquear en «Dispositivos registrados» del PC host.","fr":"Ce PC est bloqué sur l'hôte. Il peut être débloqué dans « Appareils enregistrés » sur le PC hôte.","de":"Dieser PC ist beim Host gesperrt. Unter „Registrierte Geräte“ am Host-PC lässt sich das aufheben.","pt-BR":"Este PC está bloqueado no host. Dá para desbloquear em “Dispositivos registrados” no PC host.","ru":"Этот ПК заблокирован на хосте. Снять блокировку можно в разделе «Зарегистрированные устройства» на ПК-хосте.","vi":"Máy này đã bị chặn trên máy chủ. Có thể bỏ chặn ở mục “Thiết bị đã đăng ký” trên máy chủ.","id":"PC ini diblokir di host. Blokirnya bisa dibuka di “Perangkat terdaftar” pada PC host."},"호스트가 접속을 거부했습니다.":{"en":"The host refused the connection.","ja":"ホストが接続を拒否しました。","zh-CN":"主机拒绝了连接。","zh-TW":"主機拒絕了連線。","es":"El host rechazó la conexión.","fr":"L'hôte a refusé la connexion.","de":"Der Host hat die Verbindung abgelehnt.","pt-BR":"O host recusou a conexão.","ru":"Хост отклонил подключение.","vi":"Máy chủ đã từ chối kết nối.","id":"Host menolak sambungan."},"호스트에서 클라이언트 화면을 받지 못했습니다. 다시 시도해 주세요.":{"en":"Couldn't get the client page from the host. Please try again.","ja":"ホストからクライアント画面を受け取れませんでした。もう一度お試しください。","zh-CN":"未能从主机获取客户端界面。请重试。","zh-TW":"未能從主機取得用戶端畫面。請再試一次。","es":"No se pudo obtener la página del cliente desde el host. Vuelve a intentarlo.","fr":"Impossible de récupérer la page client depuis l'hôte. Réessayez.","de":"Die Client-Seite kam nicht vom Host an. Bitte erneut versuchen.","pt-BR":"Não foi possível obter a página do cliente do host. Tente de novo.","ru":"Не удалось получить страницу клиента от хоста. Попробуйте ещё раз.","vi":"Không nhận được giao diện máy khách từ máy chủ. Hãy thử lại.","id":"Gagal mendapatkan halaman klien dari host. Silakan coba lagi."},"중개 서버에 연결할 수 없습니다":{"en":"Can't reach the relay server","ja":"中継サーバーに接続できません","zh-CN":"无法连接中转服务器","zh-TW":"無法連線中繼伺服器","es":"No se puede conectar con el servidor de retransmisión","fr":"Impossible de joindre le serveur relais","de":"Relay-Server nicht erreichbar","pt-BR":"Não é possível alcançar o servidor de retransmissão","ru":"Не удаётся подключиться к серверу-посреднику","vi":"Không kết nối được server trung gian","id":"Tidak bisa menjangkau server perantara"},"호스트가 응답하지 않습니다. 호스트가 꺼져 있거나, 호스트에서 이 PC의 등록을 지웠을 수 있습니다. 지웠다면 PC 목록의 \"키 바꾸기\"로 접속 키를 다시 넣으면 다시 등록됩니다.":{"en":"The host isn't answering. It may be off, or this PC's registration may have been removed on the host. If so, enter the access key again with “Change key” in the PC list to register again.","ja":"ホストが応答しません。ホストが停止しているか、ホストでこのPCの登録が削除された可能性があります。削除された場合は、PC一覧の「キーを変更」でアクセスキーを入れ直すと再登録されます。","zh-CN":"主机没有响应。主机可能已关闭，或主机删除了本机的注册。如果是后者，请在电脑列表中用“更换密钥”重新输入访问密钥即可重新注册。","zh-TW":"主機沒有回應。主機可能已關閉，或主機刪除了本機的註冊。如果是後者，請在電腦清單中用「變更金鑰」重新輸入存取金鑰即可重新註冊。","es":"El host no responde. Puede que esté apagado o que hayan eliminado el registro de este PC en el host. En ese caso, vuelve a introducir la clave de acceso con «Cambiar clave» en la lista de PC para registrarlo otra vez.","fr":"L'hôte ne répond pas. Il est peut-être éteint, ou l'enregistrement de ce PC a été supprimé sur l'hôte. Dans ce cas, saisissez à nouveau la clé d'accès avec « Changer la clé » dans la liste des PC pour l'enregistrer à nouveau.","de":"Der Host antwortet nicht. Er ist vielleicht aus, oder die Registrierung dieses PCs wurde dort entfernt. Dann geben Sie den Zugangsschlüssel in der PC-Liste über „Schlüssel ändern“ neu ein, um wieder registriert zu werden.","pt-BR":"O host não responde. Ele pode estar desligado, ou o registro deste PC foi removido no host. Nesse caso, digite a chave de acesso de novo em “Trocar chave” na lista de PCs para registrar outra vez.","ru":"Хост не отвечает. Возможно, он выключен или на хосте удалили регистрацию этого ПК. Тогда введите ключ доступа заново через «Сменить ключ» в списке ПК, и регистрация восстановится.","vi":"Máy chủ không phản hồi. Có thể máy chủ đang tắt, hoặc máy chủ đã xóa đăng ký của máy này. Nếu vậy, hãy nhập lại khóa truy cập bằng “Đổi khóa” trong danh sách máy để đăng ký lại.","id":"Host tidak menjawab. Mungkin host mati, atau pendaftaran PC ini dihapus di host. Jika begitu, masukkan lagi kunci akses dengan “Ganti kunci” di daftar PC untuk mendaftar ulang."},"응답이 없습니다. 1회용 코드가 틀렸거나, 만료되었거나(10분), 이미 쓰였을 수 있습니다. 호스트 PC에서 새 코드를 받아 다시 넣어 보세요.":{"en":"No answer. The one-time code may be wrong, expired (after 10 minutes) or already used. Get a new code from the host PC and try again.","ja":"応答がありません。ワンタイムコードが間違っているか、期限切れ（10分）か、すでに使われた可能性があります。ホストPCで新しいコードをもらって入力し直してください。","zh-CN":"没有响应。一次性代码可能有误、已过期（10 分钟）或已被使用。请从主机电脑获取新代码后重新输入。","zh-TW":"沒有回應。一次性代碼可能有誤、已過期（10 分鐘）或已被使用。請從主機電腦取得新代碼後重新輸入。","es":"No hay respuesta. Puede que el código de un solo uso sea incorrecto, haya caducado (a los 10 minutos) o ya se haya usado. Pide un código nuevo en el PC host y vuelve a intentarlo.","fr":"Pas de réponse. Le code à usage unique est peut-être erroné, expiré (au bout de 10 minutes) ou déjà utilisé. Demandez un nouveau code sur le PC hôte et réessayez.","de":"Keine Antwort. Der Einmalcode ist vielleicht falsch, abgelaufen (nach 10 Minuten) oder schon benutzt. Holen Sie am Host-PC einen neuen Code und versuchen Sie es erneut.","pt-BR":"Sem resposta. O código de uso único pode estar errado, expirado (após 10 minutos) ou já usado. Peça um código novo no PC host e tente de novo.","ru":"Нет ответа. Возможно, одноразовый код неверный, истёк (через 10 минут) или уже использован. Получите новый код на ПК-хосте и попробуйте снова.","vi":"Không có phản hồi. Có thể mã dùng một lần bị sai, đã hết hạn (10 phút) hoặc đã được dùng. Hãy lấy mã mới từ máy chủ rồi nhập lại.","id":"Tidak ada jawaban. Kode sekali pakai mungkin salah, kedaluwarsa (setelah 10 menit), atau sudah dipakai. Minta kode baru dari PC host lalu coba lagi."},"호스트가 응답하지 않습니다. 호스트 프로그램이 켜져 있는지와 접속 키를 확인하세요.":{"en":"The host isn't answering. Check that the host program is running and that the access key is right.","ja":"ホストが応答しません。ホストプログラムが起動しているか、アクセスキーが正しいかを確認してください。","zh-CN":"主机没有响应。请确认主机程序已开启，并检查访问密钥。","zh-TW":"主機沒有回應。請確認主機程式已開啟，並檢查存取金鑰。","es":"El host no responde. Comprueba que el programa host está en marcha y que la clave de acceso es correcta.","fr":"L'hôte ne répond pas. Vérifiez que le programme hôte est lancé et que la clé d'accès est correcte.","de":"Der Host antwortet nicht. Prüfen Sie, ob das Host-Programm läuft und der Zugangsschlüssel stimmt.","pt-BR":"O host não responde. Confira se o programa host está em execução e se a chave de acesso está certa.","ru":"Хост не отвечает. Проверьте, запущена ли программа-хост и верен ли ключ доступа.","vi":"Máy chủ không phản hồi. Hãy kiểm tra chương trình máy chủ có đang chạy không và khóa truy cập có đúng không.","id":"Host tidak menjawab. Pastikan program host berjalan dan kunci aksesnya benar."},"이 PC는 호스트에 기기로 등록되어 있어 키 없이 접속합니다.":{"en":"This PC is registered with the host as a device and connects without the key.","ja":"このPCはホストにデバイスとして登録されているため、キーなしで接続します。","zh-CN":"本机已在主机上注册为设备，无需密钥即可连接。","zh-TW":"本機已在主機上註冊為裝置，不需金鑰即可連線。","es":"Este PC está registrado en el host como dispositivo y se conecta sin la clave.","fr":"Ce PC est enregistré comme appareil sur l'hôte et se connecte sans la clé.","de":"Dieser PC ist beim Host als Gerät registriert und verbindet sich ohne Schlüssel.","pt-BR":"Este PC está registrado no host como dispositivo e conecta sem a chave.","ru":"Этот ПК зарегистрирован на хосте как устройство и подключается без ключа.","vi":"Máy này đã được đăng ký làm thiết bị với máy chủ nên kết nối không cần khóa.","id":"PC ini terdaftar di host sebagai perangkat dan tersambung tanpa kunci."},"다시 연결":{"en":"Reconnect","ja":"再接続","zh-CN":"重新连接","zh-TW":"重新連線","es":"Reconectar","fr":"Se reconnecter","de":"Neu verbinden","pt-BR":"Reconectar","ru":"Переподключиться","vi":"Kết nối lại","id":"Sambung ulang"}}} || { page: null, loader: {} };
// This PC's language: the client app's, else what this browser keeps (mr_lang, the page uses it too), else the browser's.
const langNow = () => {
  try { if (window.mrShell && typeof window.mrShell.lang === 'function') { const l = I18N.normalize(window.mrShell.lang()); if (l) return l; } } catch {}
  return I18N.normalize(store.get('mr_lang')) || I18N.pick(navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language]);
};
let tl = I18N.translator('ko');
const useLang = (l) => { tl = I18N.translator(l, I18N.table(CATALOG.loader, l)); I18N.apply(document, tl); I18N.fillSelect($('lang'), l); };
I18N.fonts(document);
useLang(langNow());
$('lang').onchange = () => {
  const l = I18N.normalize($('lang').value);
  if (!l) return;
  store.set('mr_lang', l);
  try { if (window.mrShell && typeof window.mrShell.setLang === 'function') window.mrShell.setLang(l).catch(() => {}); } catch {}
  useLang(l);
};
const preset = location.hash.slice(1) || '';
const params = new URLSearchParams(preset);
const msg = (s) => { $('msg').textContent = s; };
let busy = false;
let device = null; // { id, secret, server }: this PC's token for that host (the client app)

async function launch(html, key, updated, sig) {
  // In the client app (from 2026-11-16 on): whether a release signed this page (the host sends the signed
  // statement with it). The app gives a page its powers (saving files, the clipboard, device tokens) only then.
  const app = window.mrShell && typeof window.mrShell.pageCheck === 'function' ? window.mrShell : null;
  let signed;
  if (app) { try { signed = (await app.pageCheck({ statement: sig && sig.statement, sig: sig && sig.sig, sha256: await digest(html) })) === true; } catch { signed = false; } }
  // Replace this document with the client page. The window object is kept, so the page can read __mrBoot.
  window.__mrBoot = { key: device ? '' : key, device: device || undefined, remember: false, preset, updated, signed, i18n: CATALOG.page || undefined };
  document.open();
  document.write(html);
  document.close();
}
// The host names its page by the first 20 hex digits of its SHA-256 (getClientApp in main.js).
// Fewer digits would be easy to match with a made-up page, so a shorter name is never trusted.
async function digest(html) {
  const d = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(html)));
  return Array.from(d, (x) => x.toString(16).padStart(2, '0')).join('');
}

// fresh: do not use the stored copy of the page.
async function go(fresh) {
  // Taken at once: in the client app a second start (its key put in by the app while this one started
  // from #auto) must not run alongside (two pages written into one document break the second).
  if (busy) return;
  busy = true; $('go').disabled = true;
  const fail = (text) => { busy = false; $('go').disabled = false; msg(text); };
  const key = $('key').value.trim();
  store.set('mr_key', null); // browsers no longer keep the key (2026-11-16): what an older loader kept goes
  // The field takes an access key or a one-time code the host window made (signal.js codeOf; from 0.9.0).
  const code = device ? '' : RD.codeOf(key);
  let keys;
  try { keys = device ? await RD.derive(device.secret, RD.DEVICE) : code ? await RD.deriveCode(code) : await RD.derive(key); } catch (e) { fail(/형식/.test(e.message) ? tl('접속 키나 1회용 코드의 형식이 올바르지 않습니다') : tl('오류: {0}', e.message)); return; }
  const cached = fresh ? null : store.get('mr_app_html');
  const have = cached ? store.get('mr_app_hash') || '' : '';
  const sid = RD.rand(16);
  let done = false, chan = null;
  try {
    msg(tl('호스트에 연결하는 중…'));
    chan = RD.channel({
      server: SERVER, subTopic: keys.topicClient, pubTopic: keys.topicHost, rxKey: keys.h2c, txKey: keys.c2h,
      onMessage: async (m) => {
        if (done || !m || m.sid !== sid) return;
        if (m.t === 'denied') {
          done = true;
          chan.close();
          fail(m.why === 'blocked' ? tl('이 PC는 호스트에서 차단되었습니다. 호스트 PC의 "접속한 기기"에서 차단을 풀 수 있습니다.') : tl('호스트가 접속을 거부했습니다.'));
          return;
        }
        if (m.t !== 'app') return;
        done = true;
        chan.close();
        const sig = m.sig && typeof m.sig === 'object' ? m.sig : null; // the release's signature of the page (the client app checks it)
        if (typeof m.html === 'string' && m.html.length > 1000) {
          store.set('mr_app_html', m.html);
          store.set('mr_app_hash', String(m.hash || ''));
          launch(m.html, key, true, sig);
        } else if (cached && m.hash === have) {
          // Other local files opened in this browser can share this storage, so the stored copy may
          // not be the page it claims to be. It gets the key only when its own hash is the host's;
          // otherwise the page is fetched anew.
          let same = false;
          try { same = have.length >= 20 && (await digest(cached)).startsWith(have); } catch {}
          if (same) launch(cached, key, false, sig);
          else { fail(''); go(true); }
        } else {
          fail(tl('호스트에서 클라이언트 화면을 받지 못했습니다. 다시 시도해 주세요.'));
        }
      },
    });
    await Promise.race([chan.ready, new Promise((_, rej) => setTimeout(() => rej(new Error(tl('중개 서버에 연결할 수 없습니다'))), 10000))]);
    await chan.send({ t: 'ver', sid, ts: Date.now(), have });
    setTimeout(() => {
      if (done) return;
      done = true;
      chan.close();
      fail(device ? tl('호스트가 응답하지 않습니다. 호스트가 꺼져 있거나, 호스트에서 이 PC의 등록을 지웠을 수 있습니다. 지웠다면 PC 목록의 "키 바꾸기"로 접속 키를 다시 넣으면 다시 등록됩니다.')
        : code ? tl('응답이 없습니다. 1회용 코드가 틀렸거나, 만료되었거나(10분), 이미 쓰였을 수 있습니다. 호스트 PC에서 새 코드를 받아 다시 넣어 보세요.')
        : tl('호스트가 응답하지 않습니다. 호스트 프로그램이 켜져 있는지와 접속 키를 확인하세요.'));
    }, 15000);
  } catch (e) {
    done = true;
    if (chan) chan.close();
    fail(tl('오류: {0}', e.message));
  }
}

$('go').onclick = () => go();
$('key').addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
// A key in the slot where loaders before 2026-11-16 remembered one: the hand-over of a page that updated
// itself (#auto), or one an older loader kept. Used once and removed.
{ const k = store.get('mr_key'); if (k) { $('key').value = k; store.set('mr_key', null); } }
if (params.get('k')) { $('key').value = params.get('k'); try { history.replaceState(null, '', location.pathname); } catch {} }
// The client app gives a PC of its list that has a token of its own the token instead of the key.
const shell = window.mrShell && typeof window.mrShell.bootDevice === 'function' ? window.mrShell : null;
if (shell) {
  shell.bootDevice().then((d) => {
    if (!d || typeof d.secret !== 'string') { if (params.has('auto') && $('key').value) go(); return; }
    device = { id: String(d.id || ''), secret: d.secret, server: SERVER }; // the relay this loader is built for, always
    $('hint').textContent = tl('이 PC는 호스트에 기기로 등록되어 있어 키 없이 접속합니다.');
    $('key').style.display = 'none';
    $('go').textContent = tl('다시 연결');
    go();
  }, () => { if (params.has('auto') && $('key').value) go(); });
} else if (params.has('auto') && $('key').value) go();
})();
</script>
</body>
</html>
