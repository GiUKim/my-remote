<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Remote</title>
<style>
  html, body { height: 100%; margin: 0; background: #14171c; color: #e6e8eb; font: 14px/1.5 var(--mr-font, "Segoe UI", sans-serif); overflow-wrap: anywhere; }
  body { display: flex; align-items: center; justify-content: center; }
  .box { width: min(460px, 90vw); background: #1d2229; border: 1px solid #2c333d; border-radius: 10px; padding: 22px; }
  input[type=password] { width: 100%; box-sizing: border-box; font: 14px Consolas, monospace; padding: 8px; border-radius: 6px; border: 1px solid #3a4350; background: #0e1014; color: #fff; margin: 8px 0; }
  button { font: inherit; background: #2b6cff; color: #fff; border: 0; border-radius: 5px; padding: 8px 18px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #msg { color: #e0b341; min-height: 1.5em; margin-top: 8px; }
  small { color: #8b94a1; }
  .lang { display: inline-flex; align-items: center; gap: 4px; color: #8b94a1; font-size: 12px; }
  .lang select { font: inherit; font-size: 12.5px; background: #343c48; color: #fff; border: 0; border-radius: 5px; padding: 3px 6px; cursor: pointer; }
</style>
</head>
<body>
<div class="box">
  <div style="display:flex;align-items:center;gap:8px;margin:0 0 6px"><h2 style="margin:0;flex:1">My Remote</h2><label class="lang" title="Language"><span aria-hidden="true">🌐</span><select id="lang" aria-label="Language"></select></label></div>
  <small id="hint" data-i18n>호스트 프로그램의 접속 키, 또는 호스트에서 받은 1회용 코드를 입력하세요.</small>
  <input id="key" type="password" placeholder="접속 키 또는 1회용 코드" autocomplete="off" spellcheck="false" data-i18n-placeholder>
  <div style="margin-top:12px"><button id="go" data-i18n>접속</button></div>
  <div id="msg"></div>
</div>
<script>
// LOADER. This file is handed to a client PC once and is meant to stay unchanged.
// It only (1) asks for the access key, (2) asks the host - over the same
// encrypted, key-authenticated signaling channel used for connecting - for the
// current client page, and (3) runs that page. The client therefore always
// matches the version of the host it connects to.
//
// Bootstrap protocol (keep stable, old loaders are out there):
//   loader -> host: { t: 'ver', sid, ts, have: <hash of cached page or ''> }
//   host -> loader: { t: 'app', sid, ts, hash, html? }   html omitted when have === hash
// In the client app a PC of its list may have a token of its own instead of the key (from 2026-11-16,
// window.mrShell.bootDevice): the same exchange on the token's own topics (RD.DEVICE). A host refuses a
// blocked token: { t: 'denied', sid, why }. From 0.9.0 the field also takes a one-time code the host window
// made (RD.codeOf): the same exchange on the code's own topics (RD.deriveCode); the page gets the code as `key`.
// The texts of this file and of the page are in every language (host/i18n.js and its catalogs, put in by
// build-client.js from 0.9.6 on): this one is said in this PC's language, and the page gets its catalog
// (__mrBoot.i18n), so that it speaks that language before the host has sent it anything.
// Everything is wrapped in a function so nothing here collides with the page it loads.
(() => {
// Shared by host and client.
// Signaling over an untrusted pub/sub relay (ntfy). Every message is
// compressed, then AES-256-GCM encrypted with keys derived from the shared
// secret, so the relay only ever sees random-looking blobs on random topics.
// The WebRTC DTLS fingerprints travel inside these encrypted messages, which
// is what makes the media/input channel end-to-end authenticated.
const RD = (() => {
  const te = new TextEncoder();
  const CHUNK = 3000; // ntfy message limit is 4096 bytes

  function b64u(buf) {
    const b = new Uint8Array(buf);
    let s = '';
    for (let i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function unb64u(s) {
    s = s.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    const bin = atob(s);
    const b = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
    return b;
  }
  function rand(n) {
    return b64u(crypto.getRandomValues(new Uint8Array(n)));
  }
  async function pipe(bytes, transform) {
    const res = new Response(new Blob([bytes]).stream().pipeThrough(transform));
    return new Uint8Array(await res.arrayBuffer());
  }

  // `salt`: DEVICE for a device token (a client app's own secret, given to it by the host; see
  // host/devices.js), which gives keys and topics of its own; the access key uses the default.
  const DEVICE = 'my-remote-device-v1';
  async function derive(secret, salt) {
    const raw = unb64u(secret.trim());
    if (raw.length !== 32) throw new Error('접속 키 형식이 올바르지 않습니다');
    const base = await crypto.subtle.importKey('raw', raw, 'HKDF', false, ['deriveBits', 'deriveKey']);
    const p = (info) => ({ name: 'HKDF', hash: 'SHA-256', salt: te.encode(salt || 'my-remote-v1'), info: te.encode(info) });
    const aes = (info) => crypto.subtle.deriveKey(p(info), base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    const topic = async (info) => {
      const bits = new Uint8Array(await crypto.subtle.deriveBits(p(info), base, 128));
      return 'mr' + Array.from(bits, (x) => x.toString(16).padStart(2, '0')).join('');
    };
    return {
      c2h: await aes('client-to-host'),
      h2c: await aes('host-to-client'),
      topicHost: await topic('topic-host'),
      topicClient: await topic('topic-client'),
    };
  }

  async function seal(key, obj) {
    const plain = await pipe(te.encode(JSON.stringify(obj)), new CompressionStream('deflate-raw'));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, plain));
    const out = new Uint8Array(12 + ct.length);
    out.set(iv);
    out.set(ct, 12);
    return b64u(out);
  }
  // A message can be 40 chunks, about 90 KB of deflate data, and that could inflate to some 90 MB.
  // Real ones are far smaller (the largest, the client page, about 110 KB), so the data goes in a
  // kilobyte at a time (deflate makes at most about a megabyte of that) and inflating stops past
  // MAX_PLAIN.
  const MAX_PLAIN = 1 << 20;
  async function inflate(bytes) {
    let at = 0;
    const input = new ReadableStream({
      pull(c) {
        if (at >= bytes.length) { c.close(); return; }
        c.enqueue(bytes.slice(at, at + 1024));
        at += 1024;
      },
    });
    const reader = input.pipeThrough(new DecompressionStream('deflate-raw')).getReader();
    const dec = new TextDecoder();
    let text = '', size = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) return text + dec.decode();
      size += value.length;
      if (size > MAX_PLAIN) { reader.cancel().catch(() => {}); throw new Error('message too large'); }
      text += dec.decode(value, { stream: true });
    }
  }
  async function open(key, text) {
    const raw = unb64u(text);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(0, 12) }, key, raw.slice(12));
    return JSON.parse(await inflate(new Uint8Array(plain)));
  }

  // opts: { server, subTopic, pubTopic, rxKey, txKey, onMessage, onState }
  // The host listens on several topics at once (its own and one per device token): `subTopic` is then
  // their names joined by commas (ntfy sends each message with the topic it came on), `rxKey` a function
  // of the topic giving its key (or nothing: the message is dropped), and `onMessage` hears the topic too.
  // `send(obj, { pubTopic, txKey })` sends elsewhere than `opts` says (the answer on a device's own topic).
  function channel(opts) {
    const parts = new Map();
    let es = null, closed = false, timer = null, quiet = null, wait = 2000;
    let readyResolve;
    const ready = new Promise((r) => (readyResolve = r));

    // A new subscription in `ms`, unless the current one has opened by then.
    function resubscribe(ms) {
      clearTimeout(timer);
      timer = setTimeout(() => {
        timer = null;
        if (closed || es.readyState === EventSource.OPEN) return;
        es.close();
        connect();
      }, ms);
    }
    // After a network error the EventSource reconnects by itself. An answer other than 200
    // text/event-stream (the relay restarting behind its proxy, a rate limit, a proxy's error page)
    // makes it give up for good (CLOSED), and a connection attempt can also hang. A host left like
    // that is unreachable until someone restarts it, so a new subscription is made here: after 2 s,
    // doubling up to a minute, once it gave up; after two minutes when it does not open.
    function connect() {
      const src = (es = new EventSource(`${opts.server}/${opts.subTopic}/sse`));
      clearTimeout(quiet); quiet = null;
      resubscribe(120000);
      // ntfy sends a keepalive event every 45 s (its default). A connection lost along the way
      // (behind a proxy, after a network change) can look open for a long time without an error,
      // so a stream that brought keepalives and then stays silent for three minutes is replaced
      // too. Armed by the first keepalive after each open: a relay that sends none is never
      // replaced for silence.
      const alive = () => {
        clearTimeout(quiet);
        quiet = setTimeout(() => {
          quiet = null;
          if (closed || src !== es) return;
          opts.onState && opts.onState('retry');
          es.close();
          connect();
        }, 180000);
      };
      src.addEventListener('keepalive', () => { if (!closed && src === es) alive(); });
      src.onopen = () => {
        if (src !== es) return;
        clearTimeout(timer); timer = null; wait = 2000;
        clearTimeout(quiet); quiet = null;
        readyResolve(); opts.onState && opts.onState('open');
      };
      src.onerror = () => {
        if (closed || src !== es) return;
        opts.onState && opts.onState('retry');
        if (src.readyState === EventSource.CLOSED) { resubscribe(wait); wait = Math.min(wait * 2, 60000); }
        else if (!timer) resubscribe(120000);
      };
      src.onmessage = async (ev) => {
        if (quiet && src === es) alive();
        try {
          const m = JSON.parse(ev.data);
          const f = String(m.message || '').split('.');
          if (f.length !== 5 || f[0] !== 'mr1') return;
          const topic = typeof m.topic === 'string' ? m.topic : '';
          const key = typeof opts.rxKey === 'function' ? opts.rxKey(topic) : opts.rxKey;
          if (!key) return;
          const id = topic + '/' + f[1], i = +f[2], n = +f[3];
          // Every loader handed out drops a message of more than 40 chunks (120000 characters), so
          // the client page the host sends in one 'app' reply has to stay within that.
          if (!(n >= 1 && n <= 40 && i >= 0 && i < n)) return;
          if (!parts.has(id)) {
            // At most 30 messages being put together per topic: junk sent on one topic (by whoever holds a
            // blocked device's token) never pushes out what is coming on another.
            const mine = [...parts.keys()].filter((k) => k.startsWith(topic + '/'));
            if (mine.length > 30) for (const k of mine) parts.delete(k);
            parts.set(id, new Array(n).fill(null));
          }
          const arr = parts.get(id);
          if (arr.length !== n) return;
          arr[i] = f[4];
          if (arr.some((x) => x === null)) return;
          parts.delete(id);
          const obj = await open(key, arr.join(''));
          opts.onMessage(obj, topic);
        } catch (e) {
          // Not decryptable with our key (noise or forgery), or too large: ignore.
        }
      };
    }
    connect();

    async function send(obj, to) {
      const text = await seal((to && to.txKey) || opts.txKey, obj);
      const topic = (to && to.pubTopic) || opts.pubTopic;
      const id = rand(6);
      const n = Math.ceil(text.length / CHUNK);
      for (let i = 0; i < n; i++) {
        const body = `mr1.${id}.${i}.${n}.${text.slice(i * CHUNK, (i + 1) * CHUNK)}`;
        const r = await fetch(`${opts.server}/${topic}`, { method: 'POST', body });
        if (!r.ok) throw new Error('시그널링 서버 전송 실패: HTTP ' + r.status);
      }
    }
    function close() {
      closed = true;
      clearTimeout(timer);
      clearTimeout(quiet);
      if (es) es.close();
    }
    return { send, close, ready, get closed() { return closed; } };
  }

  function waitIce(pc, ms) {
    return new Promise((resolve) => {
      if (pc.iceGatheringState === 'complete') return resolve();
      const t = setTimeout(resolve, ms);
      pc.addEventListener('icegatheringstatechange', () => {
        if (pc.iceGatheringState === 'complete') { clearTimeout(t); resolve(); }
      });
    });
  }

  // A one-time code: the person at the host has the host window make one and gives it to someone who is to
  // help (host.js oneTime). 12 characters of Crockford's base32 (no I, L, O, U), 60 random bits, shown as
  // XXXX-XXXX-XXXX; what is typed is read forgivingly (case, spaces and dashes, O for 0, I and L for 1). It is
  // stretched (PBKDF2, 200 000 rounds) into a secret of the access key's size, which gives keys and topics of
  // their own (CODE). With 60 bits and a life of minutes, guessing it from what the relay sees is out of reach;
  // and a person at the host must still allow the request it brings. Loaders from before 0.9.0 take keys only.
  const CODE = 'my-remote-code-v1';
  const CODE_ALPHA = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
  function newCode() {
    const b = crypto.getRandomValues(new Uint8Array(12));
    let s = '';
    for (let i = 0; i < 12; i++) s += CODE_ALPHA[b[i] & 31];
    return s;
  }
  // What was typed, as a code; '' when it is none (an access key: 43 characters).
  function codeOf(text) {
    const s = String(text || '').toUpperCase().replace(/[\s-]/g, '').replace(/O/g, '0').replace(/[IL]/g, '1');
    return /^[0-9A-HJKMNP-TV-Z]{12}$/.test(s) ? s : '';
  }
  const showCode = (code) => String(code).replace(/(.{4})(?=.)/g, '$1-');
  async function deriveCode(code) {
    const base = await crypto.subtle.importKey('raw', te.encode(code), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: te.encode(CODE), iterations: 200000 }, base, 256);
    return derive(b64u(bits), CODE);
  }

  return { derive, channel, waitIce, rand, DEVICE, CODE, newCode, codeOf, showCode, deriveCode };
})();

(function (root) {
  'use strict';
  const LANGS = [
    { code: 'ko', name: '한국어' },
    { code: 'en', name: 'English' },
    { code: 'ja', name: '日本語' },
    { code: 'zh-CN', name: '简体中文' },
    { code: 'zh-TW', name: '繁體中文' },
    { code: 'es', name: 'Español' },
    { code: 'fr', name: 'Français' },
    { code: 'de', name: 'Deutsch' },
    { code: 'pt-BR', name: 'Português (Brasil)' },
    { code: 'ru', name: 'Русский' },
    { code: 'vi', name: 'Tiếng Việt' },
    { code: 'id', name: 'Bahasa Indonesia' },
  ];
  const CODES = LANGS.map((l) => l.code);
  function normalize(tag) {
    const s = String(tag || '').trim().replace(/_/g, '-').toLowerCase();
    if (!s) return '';
    const exact = CODES.find((c) => c.toLowerCase() === s);
    if (exact) return exact;
    const [lang, ...rest] = s.split('-');
    if (lang === 'zh') {
      return rest.some((p) => p === 'hant' || p === 'tw' || p === 'hk' || p === 'mo') ? 'zh-TW' : 'zh-CN';
    }
    if (lang === 'pt') return 'pt-BR'; // the one Portuguese offered (the Brazilian, which most Portuguese apps choose)
    if (lang === 'in') return 'id'; // the old code for Indonesian, still sent by some systems
    if (lang === 'nb' || lang === 'no') return '';
    return CODES.includes(lang) ? lang : '';
  }
  function pick(tags) {
    for (const t of tags || []) { const n = normalize(t); if (n) return n; }
    return 'en';
  }
  function table(catalog, lang) {
    const out = {};
    if (!catalog || lang === 'ko') return out;
    for (const [src, e] of Object.entries(catalog)) {
      if (!e || typeof e !== 'object') continue;
      const v = e[lang] != null ? e[lang] : e.en;
      if (v != null) out[src] = v;
    }
    return out;
  }
  const fill = (s, args) => String(s).replace(/\{(\d+)\}/g, (m, i) => (args[i] != null ? String(args[i]) : m));
  function translator(lang, ...tables) {
    const merged = Object.assign({}, ...tables.filter(Boolean));
    let rules = null;
    try { rules = new Intl.PluralRules(lang === 'ko' ? 'ko' : lang); } catch {}
    const t = (src, ...args) => {
      let v = Object.prototype.hasOwnProperty.call(merged, src) ? merged[src] : src;
      if (v && typeof v === 'object') {
        const n = Number(args[0]);
        const cat = rules && Number.isFinite(n) ? rules.select(n) : 'other';
        v = v[cat] != null ? v[cat] : v.other != null ? v.other : src;
      }
      return fill(v, args);
    };
    t.lang = lang;
    t.has = (src) => Object.prototype.hasOwnProperty.call(merged, src);
    return t;
  }
  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ESC[c]); // text that must stay text (a name)
  function safeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ESC[c]).replace(/&lt;(\/?)(b|i|kbd|small|code)&gt;|&lt;br\s*\/?&gt;/g, (m, slash, tag) => (tag ? `<${slash}${tag}>` : '<br>'));
  }
  const ATTRS = [['title', 'title'], ['placeholder', 'placeholder'], ['aria', 'aria-label']];
  function apply(root, t) {
    const doc = root.ownerDocument || root;
    if (doc.documentElement) doc.documentElement.lang = t.lang;
    const each = (sel, f) => { if (root.matches && root.matches(sel)) f(root); root.querySelectorAll(sel).forEach(f); };
    each('[data-i18n]', (el) => {
      if (el.dataset.i18nSrc == null) el.dataset.i18nSrc = el.textContent.trim();
      el.textContent = t(el.dataset.i18nSrc);
    });
    each('[data-i18n-html]', (el) => {
      if (el.dataset.i18nSrcHtml == null) el.dataset.i18nSrcHtml = el.innerHTML.trim().replace(/\s+/g, ' ');
      el.innerHTML = safeHtml(t(el.dataset.i18nSrcHtml));
    });
    for (const [key, attr] of ATTRS) {
      const flag = 'i18n' + key[0].toUpperCase() + key.slice(1), keep = flag + 'Src';
      each(`[data-i18n-${key}]`, (el) => {
        if (el.dataset[keep] == null) el.dataset[keep] = el.getAttribute(attr) || '';
        if (el.dataset[keep]) el.setAttribute(attr, t(el.dataset[keep]));
      });
    }
  }
  const FLAGS = {
    "ko": '<rect width="30" height="20" fill="#fff"/><g transform="rotate(33.69 15 10)"><circle cx="15" cy="10" r="5" fill="#0047A0"/><path d="M10 10a5 5 0 0 1 10 0z" fill="#CD2E3A"/><circle cx="12.5" cy="10" r="2.5" fill="#CD2E3A"/><circle cx="17.5" cy="10" r="2.5" fill="#0047A0"/><g fill="#000"><rect x="6.67" y="7.5" width="0.83" height="5"/><rect x="5.42" y="7.5" width="0.83" height="5"/><rect x="4.17" y="7.5" width="0.83" height="5"/><rect x="22.5" y="7.5" width="0.83" height="2.29"/><rect x="22.5" y="10.21" width="0.83" height="2.29"/><rect x="23.75" y="7.5" width="0.83" height="2.29"/><rect x="23.75" y="10.21" width="0.83" height="2.29"/><rect x="25" y="7.5" width="0.83" height="2.29"/><rect x="25" y="10.21" width="0.83" height="2.29"/></g></g><g transform="rotate(-33.69 15 10)" fill="#000"><rect x="22.5" y="7.5" width="0.83" height="2.29"/><rect x="22.5" y="10.21" width="0.83" height="2.29"/><rect x="23.75" y="7.5" width="0.83" height="5"/><rect x="25" y="7.5" width="0.83" height="2.29"/><rect x="25" y="10.21" width="0.83" height="2.29"/><rect x="6.67" y="7.5" width="0.83" height="5"/><rect x="5.42" y="7.5" width="0.83" height="2.29"/><rect x="5.42" y="10.21" width="0.83" height="2.29"/><rect x="4.17" y="7.5" width="0.83" height="5"/></g>',

,"id":"Tutup"},"복사":{"en":"Copy","ja":"コピー","zh-CN":"复制","zh-TW":"複製","es":"Copiar","fr":"Copier","de":"Kopieren","pt-BR":"Copiar","ru":"Копировать","vi":"Sao chép","id":"Salin"},"새로 고침":{"en":"Refresh","ja":"更新","zh-CN":"刷新","zh-TW":"重新整理","es":"Actualizar","fr":"Actualiser","de":"Aktualisieren","pt-BR":"Atualizar","ru":"Обновить","vi":"Làm mới","id":"Muat ulang"},"영상 코덱":{"en":"Video codec","ja":"映像コーデック","zh-CN":"视频编解码器","zh-TW":"視訊編解碼器","es":"Códec de vídeo","fr":"Codec vidéo","de":"Video-Codec","pt-BR":"Codec de vídeo","ru":"Видеокодек","vi":"Codec video","id":"Codec video"},"호스트 기본값":{"en":"Host default","ja":"ホストの既定値","zh-CN":"主机默认值","zh-TW":"主機預設值","es":"Predeterminado del host","fr":"Par défaut de l'hôte","de":"Standard des Hosts","pt-BR":"Padrão do host","ru":"По умолчанию хоста","vi":"Mặc định của máy chủ","id":"Bawaan host"},"H.264 (그래픽카드 가속)":{"en":"H.264 (graphics card)","ja":"H.264（グラフィックカードで高速化）","zh-CN":"H.264（显卡加速）","zh-TW":"H.264（顯示卡加速）","es":"H.264 (tarjeta gráfica)","fr":"H.264 (carte graphique)","de":"H.264 (Grafikkarte)","pt-BR":"H.264 (placa de vídeo)","ru":"H.264 (видеокарта)","vi":"H.264 (tăng tốc bằng card đồ họa)","id":"H.264 (kartu grafis)"},"H.264 최고 화질 (매우 빠른 회선 전용)":{"en":"H.264 top quality (very fast connections only)","ja":"H.264 最高画質（非常に速い回線専用）","zh-CN":"H.264 最高画质（仅限极快网络）","zh-TW":"H.264 最高畫質（僅限極快網路）","es":"H.264 máxima calidad (solo conexiones muy rápidas)","fr":"H.264 qualité maximale (connexions très rapides uniquement)","de":"H.264 höchste Qualität (nur sehr schnelle Leitungen)","pt-BR":"H.264 qualidade máxima (só conexões muito rápidas)","ru":"H.264 максимальное качество (только очень быстрые сети)","vi":"H.264 chất lượng cao nhất (chỉ mạng rất nhanh)","id":"H.264 kualitas tertinggi (hanya koneksi sangat cepat)"},"AV1 (글자가 선명, 호스트 CPU 사용)":{"en":"AV1 (crisp text, uses the host's CPU)","ja":"AV1（文字が鮮明、ホストのCPUを使用）","zh-CN":"AV1（文字清晰，占用主机 CPU）","zh-TW":"AV1（文字清晰，使用主機 CPU）","es":"AV1 (texto nítido, usa la CPU del host)","fr":"AV1 (texte net, utilise le processeur de l'hôte)","de":"AV1 (scharfe Schrift, nutzt die CPU des Hosts)","pt-BR":"AV1 (texto nítido, usa a CPU do host)","ru":"AV1 (чёткий текст, нагружает процессор хоста)","vi":"AV1 (chữ sắc nét, dùng CPU của máy chủ)","id":"AV1 (teks tajam, memakai CPU host)"},"코덱을 바꾸면 즉시 다시 연결합니다. 끊김이 있을 때 다른 코덱과 비교해 보세요. \"최고 화질\"은 화면이 바뀐 순간부터 원본과 구별하기 어렵지만 수십 Mbps를 쓰므로, 양쪽 회선이 모두 빠를 때만 좋습니다. 느린 회선에서는 오히려 끊깁니다.":{"en":"Changing the codec reconnects at once. If the picture stutters, compare with another codec. “Top quality” is nearly indistinguishable from the original from the moment the screen changes, but it uses tens of Mbps, so it only helps when both connections are fast. On a slow connection it stutters more, not less.","ja":"コーデックを変えるとすぐに再接続します。途切れるときはほかのコーデックと比べてみてください。「最高画質」は画面が変わった瞬間から原本と見分けがつかないほどですが、数十 Mbps を使うため、両方の回線が速いときにだけ向いています。遅い回線ではかえって途切れます。","zh-CN":"更换编解码器会立即重新连接。画面卡顿时，可以和其他编解码器比较一下。“最高画质”从画面变化的那一刻起就几乎与原画无异，但会占用数十 Mbps，只有两端网络都很快时才合适。网络慢时反而更卡。","zh-TW":"更換編解碼器會立即重新連線。畫面卡頓時，可以和其他編解碼器比較看看。「最高畫質」從畫面變化的那一刻起就幾乎與原畫無異，但會佔用數十 Mbps，只有兩端網路都很快時才適合。網路慢時反而更卡。","es":"Al cambiar el códec se vuelve a conectar al momento. Si la imagen se corta, compara con otro códec. «Máxima calidad» es casi idéntica al original desde que cambia la pantalla, pero usa decenas de Mbps, así que solo conviene si las dos conexiones son rápidas. En una conexión lenta se corta más, no menos.","fr":"Changer de codec reconnecte aussitôt. Si l'image saccade, comparez avec un autre codec. « Qualité maximale » est presque identique à l'original dès que l'écran change, mais consomme des dizaines de Mbit/s : elle ne convient que si les deux connexions sont rapides. Sur une connexion lente, elle saccade davantage.","de":"Ein Codec-Wechsel verbindet sofort neu. Ruckelt das Bild, vergleichen Sie mit einem anderen Codec. „Höchste Qualität“ ist ab dem Moment, in dem sich das Bild ändert, kaum vom Original zu unterscheiden, braucht aber Dutzende Mbit/s – nur sinnvoll, wenn beide Leitungen schnell sind. Auf einer langsamen Leitung ruckelt es eher mehr.","pt-BR":"Trocar o codec reconecta na hora. Se a imagem travar, compare com outro codec. “Qualidade máxima” fica quase igual ao original desde o momento em que a tela muda, mas usa dezenas de Mbps, então só vale a pena quando as duas conexões são rápidas. Numa conexão lenta, trava ainda mais.","ru":"При смене кодека подключение сразу переустанавливается. Если изображение дёргается, сравните с другим кодеком. «Максимальное качество» почти не отличить от оригинала с первого же кадра после изменения, но оно требует десятков Мбит/с, поэтому подходит, только когда быстры обе сети. На медленной сети прерываний станет больше.","vi":"Đổi codec sẽ kết nối lại ngay. Khi hình bị giật, hãy thử so với codec khác. “Chất lượng cao nhất” gần như không khác bản gốc ngay từ lúc màn hình thay đổi, nhưng tốn hàng chục Mbps nên chỉ hợp khi cả hai đầu mạng đều nhanh. Trên mạng chậm lại càng giật hơn.","id":"Mengganti codec langsung menyambung ulang. Jika gambar tersendat, bandingkan dengan codec lain. “Kualitas tertinggi” nyaris sama dengan aslinya sejak layar berubah, tetapi memakai puluhan Mbps, jadi hanya cocok bila kedua koneksi cepat. Pada koneksi lambat justru makin tersendat."},"사용법":{"en":"How to use","ja":"使い方","zh-CN":"使用方法","zh-TW":"使用方式","es":"Cómo se usa","fr":"Mode d'emploi","de":"Bedienung","pt-BR":"Como usar","ru":"Как пользоваться","vi":"Cách dùng","id":"Cara pakai"},"\u003cb>위\u003c/b>는 호스트 PC(원격으로 조작하는 PC)의 모니터이고 지금 화면이 그대로 보입니다. \u003cb>아래\u003c/b>는 이 PC의 모니터입니다. 같은 색과 선으로 이어진 것끼리 짝입니다.":{"en":"\u003cb>Top\u003c/b>: the monitors of the host PC (the PC you control remotely), showing what is on them now. \u003cb>Bottom\u003c/b>: this PC's monitors. Pairs share a color and a line.","ja":"\u003cb>上\u003c/b>はホストPC（リモートで操作するPC）のモニターで、今の画面がそのまま見えます。\u003cb>下\u003c/b>はこのPCのモニターです。同じ色と線でつながったもの同士がペアです。","zh-CN":"\u003cb>上方\u003c/b>是主机电脑（被远程控制的电脑）的显示器，显示的就是当前画面。\u003cb>下方\u003c/b>是本机的显示器。颜色相同、用线相连的是一对。","zh-TW":"\u003cb>上方\u003c/b>是主機電腦（被遠端控制的電腦）的螢幕，顯示的就是目前畫面。\u003cb>下方\u003c/b>是本機的螢幕。顏色相同、以線相連的是一對。","es":"\u003cb>Arriba\u003c/b>: los monitores del PC host (el que controlas en remoto), con lo que muestran ahora. \u003cb>Abajo\u003c/b>: los monitores de este PC. Los que comparten color y línea forman pareja.","fr":"\u003cb>En haut\u003c/b> : les écrans du PC hôte (celui que vous contrôlez à distance), avec ce qu'ils affichent en ce moment. \u003cb>En bas\u003c/b> : les écrans de ce PC. Ceux reliés par la même couleur et un trait vont ensemble.","de":"\u003cb>Oben\u003c/b>: die Monitore des Host-PCs (des PCs, den Sie fernsteuern), mit ihrem aktuellen Bild. \u003cb>Unten\u003c/b>: die Monitore dieses PCs. Paare haben dieselbe Farbe und eine Linie.","pt-BR":"\u003cb>Em cima\u003c/b>: os monitores do PC host (o que você controla remotamente), mostrando o que está neles agora. \u003cb>Embaixo\u003c/b>: os monitores deste PC. Os que têm a mesma cor e estão ligados por uma linha formam par.","ru":"\u003cb>Вверху\u003c/b> — мониторы ПК-хоста (того, которым вы управляете удалённо), с тем, что на них сейчас. \u003cb>Внизу\u003c/b> — мониторы этого ПК. Пары связаны одним цветом и линией.","vi":"\u003cb>Phía trên\u003c/b> là màn hình của máy chủ (máy bạn điều khiển từ xa), hiển thị đúng nội dung hiện tại. \u003cb>Phía dưới\u003c/b> là màn hình của máy này. Những cái cùng màu và nối bằng một đường là một cặp.","id":"\u003cb>Atas\u003c/b>: monitor PC host (PC yang Anda kendalikan dari jauh), menampilkan isinya saat ini. \u003cb>Bawah\u003c/b>: monitor PC ini. Yang berwarna sama dan terhubung garis adalah pasangan."},"\u003ci>끌어다 놓기\u003c/i>자리를 바꿉니다. 꺼진 모니터에 놓으면 그쪽으로 옮깁니다.":{"en":"\u003ci>Drag and drop\u003c/i>Swaps places. Dropped on a monitor that is off, it moves there.","ja":"\u003ci>ドラッグ＆ドロップ\u003c/i>位置を入れ替えます。オフのモニターにドロップするとそちらへ移ります。","zh-CN":"\u003ci>拖放\u003c/i>交换位置。放到关闭的显示器上则移过去。","zh-TW":"\u003ci>拖放\u003c/i>交換位置。放到關閉的螢幕上則移過去。","es":"\u003ci>Arrastrar y soltar\u003c/i>Intercambia posiciones. Si lo sueltas en un monitor apagado, se mueve allí.","fr":"\u003ci>Glisser-déposer\u003c/i>Échange les places. Déposé sur un écran éteint, il s'y déplace.","de":"\u003ci>Ziehen und ablegen\u003c/i>Tauscht die Plätze. Auf einem ausgeschalteten Monitor abgelegt, wird er dorthin verschoben.","pt-BR":"\u003ci>Arrastar e soltar\u003c/i>Troca de lugar. Solto num monitor desligado, ele vai para lá.","ru":"\u003ci>Перетаскивание\u003c/i>Меняет местами. Если отпустить на выключенном мониторе — переносит туда.","vi":"\u003ci>Kéo thả\u003c/i>Đổi chỗ cho nhau. Thả vào màn hình đang tắt thì chuyển sang đó.","id":"\u003ci>Seret dan lepas\u003c/i>Menukar posisi. Jika dilepas di monitor yang mati, pindah ke sana."},"\u003ci>Ctrl + 끌어다 놓기\u003c/i>옮기지 않고 같은 화면에 나란히 함께 띄웁니다.":{"en":"\u003ci>Ctrl + drag and drop\u003c/i>Shows both side by side on the same screen instead of moving.","ja":"\u003ci>Ctrl + ドラッグ＆ドロップ\u003c/i>移動せずに、同じ画面に並べて一緒に表示します。","zh-CN":"\u003ci>Ctrl + 拖放\u003c/i>不移动，而是在同一屏幕上并排显示。","zh-TW":"\u003ci>Ctrl + 拖放\u003c/i>不移動，而是在同一畫面上並排顯示。","es":"\u003ci>Ctrl + arrastrar y soltar\u003c/i>En lugar de mover, muestra ambos uno junto a otro en la misma pantalla.","fr":"\u003ci>Ctrl + glisser-déposer\u003c/i>Au lieu de déplacer, affiche les deux côte à côte sur le même écran.","de":"\u003ci>Strg + Ziehen und ablegen\u003c/i>Statt zu verschieben, zeigt beide nebeneinander auf demselben Bildschirm.","pt-BR":"\u003ci>Ctrl + arrastar e soltar\u003c/i>Em vez de mover, mostra os dois lado a lado na mesma tela.","ru":"\u003ci>Ctrl + перетаскивание\u003c/i>Не переносит, а показывает оба рядом на одном экране.","vi":"\u003ci>Ctrl + kéo thả\u003c/i>Không chuyển mà hiện cả hai cạnh nhau trên cùng một màn hình.","id":"\u003ci>Ctrl + seret dan lepas\u003c/i>Tidak memindahkan, tetapi menampilkan keduanya berdampingan di layar yang sama."},"\u003ci>호스트 모니터 클릭\u003c/i>끕니다. 다시 클릭하면 있던 자리에 켭니다.":{"en":"\u003ci>Click a host monitor\u003c/i>Turns it off. Click again to turn it back on where it was.","ja":"\u003ci>ホストモニターをクリック\u003c/i>オフにします。もう一度クリックすると元の場所でオンになります。","zh-CN":"\u003ci>点击主机显示器\u003c/i>将其关闭。再次点击会在原位置重新开启。","zh-TW":"\u003ci>點選主機螢幕\u003c/i>將其關閉。再次點選會在原位置重新開啟。","es":"\u003ci>Clic en un monitor del host\u003c/i>Lo apaga. Otro clic lo vuelve a encender donde estaba.","fr":"\u003ci>Clic sur un écran de l'hôte\u003c/i>L'éteint. Un nouveau clic le rallume à sa place.","de":"\u003ci>Klick auf einen Host-Monitor\u003c/i>Schaltet ihn aus. Ein weiterer Klick schaltet ihn am alten Platz wieder ein.","pt-BR":"\u003ci>Clique num monitor do host\u003c/i>Desliga. Outro clique liga de novo no lugar onde estava.","ru":"\u003ci>Щелчок по монитору хоста\u003c/i>Выключает его. Повторный щелчок включает на прежнем месте.","vi":"\u003ci>Nhấp màn hình máy chủ\u003c/i>Tắt nó đi. Nhấp lại để bật ở chỗ cũ.","id":"\u003ci>Klik monitor host\u003c/i>Mematikannya. Klik lagi untuk menyalakannya di tempat semula."},"\u003ci>위 ↔ 아래로 끌기\u003c/i>그 화면에 그 모니터를 띄웁니다.":{"en":"\u003ci>Drag between top and bottom\u003c/i>Shows that monitor on that screen.","ja":"\u003ci>上 ↔ 下へドラッグ\u003c/i>その画面にそのモニターを表示します。","zh-CN":"\u003ci>在上下之间拖动\u003c/i>在该屏幕上显示那台显示器。","zh-TW":"\u003ci>在上下之間拖曳\u003c/i>在該畫面上顯示那台螢幕。","es":"\u003ci>Arrastrar entre arriba y abajo\u003c/i>Muestra ese monitor en esa pantalla.","fr":"\u003ci>Glisser entre haut et bas\u003c/i>Affiche cet écran de l'hôte sur cet écran-ci.","de":"\u003ci>Zwischen oben und unten ziehen\u003c/i>Zeigt diesen Monitor auf diesem Bildschirm.","pt-BR":"\u003ci>Arrastar entre cima e baixo\u003c/i>Mostra aquele monitor naquela tela.","ru":"\u003ci>Перетащить между верхом и низом\u003c/i>Показывает этот монитор на этом экране.","vi":"\u003ci>Kéo giữa trên ↔ dưới\u003c/i>Hiện màn hình đó lên màn hình kia.","id":"\u003ci>Seret antara atas ↔ bawah\u003c/i>Menampilkan monitor itu di layar tersebut."},"\u003ci>기본 배치\u003c/i>왼쪽부터 순서대로 짝짓습니다.":{"en":"\u003ci>Default layout\u003c/i>Pairs them in order from the left.","ja":"\u003ci>標準の配置\u003c/i>左から順にペアにします。","zh-CN":"\u003ci>默认布局\u003c/i>从左到右依次配对。","zh-TW":"\u003ci>預設配置\u003c/i>從左到右依序配對。","es":"\u003ci>Disposición predeterminada\u003c/i>Los empareja por orden desde la izquierda.","fr":"\u003ci>Disposition par défaut\u003c/i>Les associe dans l'ordre, de gauche à droite.","de":"\u003ci>Standardanordnung\u003c/i>Ordnet der Reihe nach von links zu.","pt-BR":"\u003ci>Disposição padrão\u003c/i>Forma os pares em ordem a partir da esquerda.","ru":"\u003ci>Стандартное расположение\u003c/i>Составляет пары по порядку слева направо.","vi":"\u003ci>Bố trí mặc định\u003c/i>Ghép cặp theo thứ tự từ trái sang.","id":"\u003ci>Susunan bawaan\u003c/i>Memasangkan berurutan dari kiri."},"\u003ci>전체화면으로 시작\u003c/i>창을 모두 전체화면으로 바꾸고 닫습니다.":{"en":"\u003ci>Start in full screen\u003c/i>Puts every window in full screen and closes this panel.","ja":"\u003ci>全画面表示で開始\u003c/i>すべてのウィンドウを全画面表示にして、このパネルを閉じます。","zh-CN":"\u003ci>以全屏开始\u003c/i>把所有窗口切换为全屏，并关闭此面板。","zh-TW":"\u003ci>以全螢幕開始\u003c/i>把所有視窗切換為全螢幕，並關閉此面板。","es":"\u003ci>Empezar en pantalla completa\u003c/i>Pone todas las ventanas en pantalla completa y cierra este panel.","fr":"\u003ci>Démarrer en plein écran\u003c/i>Met toutes les fenêtres en plein écran et ferme ce panneau.","de":"\u003ci>Im Vollbild starten\u003c/i>Schaltet alle Fenster ins Vollbild und schließt dieses Feld.","pt-BR":"\u003ci>Começar em tela cheia\u003c/i>Coloca todas as janelas em tela cheia e fecha este painel.","ru":"\u003ci>Начать в полноэкранном режиме\u003c/i>Разворачивает все окна на весь экран и закрывает эту панель.","vi":"\u003ci>Bắt đầu toàn màn hình\u003c/i>Chuyển mọi cửa sổ sang toàn màn hình rồi đóng bảng này.","id":"\u003ci>Mulai layar penuh\u003c/i>Menjadikan semua jendela layar penuh lalu menutup panel ini."},"바꾼 배치는 바로 적용되고 다음에도 기억됩니다.":{"en":"Changes apply at once and are remembered for next time.","ja":"変更した配置はすぐに反映され、次回も記憶されます。","zh-CN":"更改的布局会立即生效，下次也会记住。","zh-TW":"變更的配置會立即生效，下次也會記住。","es":"Los cambios se aplican al momento y se recuerdan para la próxima vez.","fr":"Les changements s'appliquent aussitôt et sont mémorisés pour la prochaine fois.","de":"Änderungen gelten sofort und werden für das nächste Mal gemerkt.","pt-BR":"As mudanças valem na hora e ficam guardadas para a próxima vez.","ru":"Изменения применяются сразу и запоминаются на следующий раз.","vi":"Thay đổi được áp dụng ngay và được ghi nhớ cho lần sau.","id":"Perubahan langsung berlaku dan diingat untuk lain kali."},"호스트 PC":{"en":"Host PC","ja":"ホストPC","zh-CN":"主机电脑","zh-TW":"主機電腦","es":"PC host","fr":"PC hôte","de":"Host-PC","pt-BR":"PC host","ru":"ПК-хост","vi":"Máy chủ","id":"PC host"},"이 PC":{"en":"This PC","ja":"このPC","zh-CN":"本机","zh-TW":"本機","es":"Este PC","fr":"Ce PC","de":"Dieser PC","pt-BR":"Este PC","ru":"Этот ПК","vi":"Máy này","id":"PC ini"},"이 PC의 다른 모니터도 사용":{"en":"Use this PC's other monitors too","ja":"このPCのほかのモニターも使う","zh-CN":"也使用本机的其他显示器","zh-TW":"也使用本機的其他螢幕","es":"Usar también los otros monitores de este PC","fr":"Utiliser aussi les autres écrans de ce PC","de":"Auch die anderen Monitore dieses PCs nutzen","pt-BR":"Usar também os outros monitores deste PC","ru":"Использовать и другие мониторы этого ПК","vi":"Dùng cả các màn hình khác của máy này","id":"Pakai juga monitor lain di PC ini"},"기본 배치":{"en":"Default layout","ja":"標準の配置","zh-CN":"默认布局","zh-TW":"預設配置","es":"Disposición predeterminada","fr":"Disposition par défaut","de":"Standardanordnung","pt-BR":"Disposição padrão","ru":"Стандартное расположение","vi":"Bố trí mặc định","id":"Susunan bawaan"},"전체화면으로 시작":{"en":"Start in full screen","ja":"全画面表示で開始","zh-CN":"以全屏开始","zh-TW":"以全螢幕開始","es":"Empezar en pantalla completa","fr":"Démarrer en plein écran","de":"Im Vollbild starten","pt-BR":"Começar em tela cheia","ru":"Начать в полноэкранном режиме","vi":"Bắt đầu toàn màn hình","id":"Mulai layar penuh"},"호스트의 허용을 기다리는 중":{"en":"Waiting for the host to allow you in","ja":"ホストの許可を待っています","zh-CN":"正在等待主机允许","zh-TW":"正在等待主機允許","es":"Esperando a que el host lo permita","fr":"En attente de l'autorisation de l'hôte","de":"Warten auf Zulassung durch den Host","pt-BR":"Aguardando a permissão do host","ru":"Ожидание разрешения хоста","vi":"Đang chờ máy chủ cho phép","id":"Menunggu izin dari host"},"이 기기는 아직 이 호스트에 등록되지 않았습니다. 호스트 PC 화면에 뜬 요청에서 \u003cb>허용\u003c/b>을 누르세요(이미 등록한 다른 기기로 호스트에 접속해 눌러도 됩니다). 요청에 아래와 같은 숫자가 보여야 합니다.":{"en":"This device isn't registered with this host yet. Press \u003cb>Allow\u003c/b> on the request shown on the host PC's screen (or connect to the host from another device that is already registered and press it there). The request should show the same number as below.","ja":"このデバイスはまだこのホストに登録されていません。ホストPCの画面に表示された要求で\u003cb>許可\u003c/b>を押してください（登録済みのほかのデバイスからホストに接続して押してもかまいません）。要求には下と同じ番号が表示されているはずです。","zh-CN":"此设备尚未在这台主机上注册。请在主机电脑屏幕上弹出的请求中点\u003cb>允许\u003c/b>（也可以用其他已注册的设备连接到主机后点）。请求中应显示与下方相同的数字。","zh-TW":"此裝置尚未在這台主機上註冊。請在主機電腦畫面上跳出的要求中按\u003cb>允許\u003c/b>（也可以用其他已註冊的裝置連線到主機後按）。要求中應顯示與下方相同的數字。","es":"Este dispositivo aún no está registrado en este host. Pulsa \u003cb>Permitir\u003c/b> en la solicitud que aparece en la pantalla del PC host (o conéctate al host desde otro dispositivo ya registrado y púlsalo allí). La solicitud debe mostrar el mismo número que ves abajo.","fr":"Cet appareil n'est pas encore enregistré sur cet hôte. Appuyez sur \u003cb>Autoriser\u003c/b> dans la demande affichée sur l'écran du PC hôte (ou connectez-vous à l'hôte depuis un autre appareil déjà enregistré et appuyez-y). La demande doit afficher le même numéro que ci-dessous.","de":"Dieses Gerät ist bei diesem Host noch nicht registriert. Drücken Sie in der Anfrage auf dem Bildschirm des Host-PCs auf \u003cb>Zulassen\u003c/b> (oder verbinden Sie sich von einem bereits registrierten Gerät mit dem Host und drücken es dort). Die Anfrage sollte dieselbe Zahl wie unten zeigen.","pt-BR":"Este dispositivo ainda não está registrado neste host. Toque em \u003cb>Permitir\u003c/b> no pedido que aparece na tela do PC host (ou conecte-se ao host de outro dispositivo já registrado e toque lá). O pedido deve mostrar o mesmo número que aparece abaixo.","ru":"Это устройство ещё не зарегистрировано на этом хосте. Нажмите \u003cb>Разрешить\u003c/b> в запросе на экране ПК-хоста (или подключитесь к хосту с другого, уже зарегистрированного устройства и нажмите там). В запросе должно быть такое же число, как ниже.","vi":"Thiết bị này chưa được đăng ký với máy chủ này. Hãy bấm \u003cb>Cho phép\u003c/b> trong yêu cầu hiện trên màn hình máy chủ (hoặc kết nối vào máy chủ từ thiết bị khác đã đăng ký rồi bấm ở đó). Yêu cầu phải hiện đúng con số như bên dưới.","id":"Perangkat ini belum terdaftar di host ini. Tekan \u003cb>Izinkan\u003c/b> pada permintaan yang muncul di layar PC host (atau sambungkan ke host dari perangkat lain yang sudah terdaftar lalu tekan di sana). Permintaan itu harus menampilkan angka yang sama seperti di bawah."},"또는 휴대폰 인증 앱의 6자리 코드:":{"en":"Or the 6-digit code from the authenticator app:","ja":"または認証アプリの6桁のコード:","zh-CN":"或输入手机验证器的 6 位代码：","zh-TW":"或輸入手機驗證器的 6 位代碼：","es":"O el código de 6 dígitos de la app de autenticación:","fr":"Ou le code à 6 chiffres de l'application d'authentification :","de":"Oder der 6-stellige Code aus der Authenticator-App:","pt-BR":"Ou o código de 6 dígitos do app autenticador:","ru":"Или 6-значный код из приложения-аутентификатора:","vi":"Hoặc mã 6 chữ số từ ứng dụng xác thực:","id":"Atau kode 6 digit dari aplikasi autentikator:"},"확인":{"en":"OK","ja":"確認","zh-CN":"确认","zh-TW":"確認","es":"Aceptar","fr":"OK","de":"OK","pt-BR":"OK","ru":"ОК","vi":"OK","id":"OK"},"취소":{"en":"Cancel","ja":"キャンセル","zh-CN":"取消","zh-TW":"取消","es":"Cancelar","fr":"Annuler","de":"Abbrechen","pt-BR":"Cancelar","ru":"Отмена","vi":"Hủy","id":"Batal"},"호스트 프로그램의 접속 키, 또는 호스트에서 받은 1회용 코드를 입력하세요.":{"en":"Enter the host program's access key, or a one-time code you got from the host.","ja":"ホストプログラムのアクセスキー、またはホストから受け取ったワンタイムコードを入力してください。","zh-CN":"请输入主机程序的访问密钥，或从主机获得的一次性代码。","zh-TW":"請輸入主機程式的存取金鑰，或從主機取得的一次性代碼。","es":"In ンになっているため、色が実際より明るく見えます。ホストPCのディスプレイ設定で HDR をオフにすると解決します。","zh-CN":"注意：主机上此显示器开启了 HDR，颜色看起来比实际更亮。在主机电脑的显示设置中关闭 HDR 即可解决。","zh-TW":"注意：主機上此螢幕開啟了 HDR，顏色看起來比實際更亮。在主機電腦的顯示器設定中關閉 HDR 即可解決。","es":"Atención: este monitor tiene HDR activado en el host, así que los colores se ven más claros de lo que son. Se arregla desactivando HDR en la configuración de pantalla del PC host.","fr":"Attention : le HDR est activé pour cet écran sur l'hôte, les couleurs paraissent plus claires qu'en réalité. Désactivez le HDR dans les paramètres d'affichage du PC hôte pour corriger.","de":"Hinweis: Auf dem Host ist für diesen Monitor HDR an, daher wirken die Farben heller als sie sind. HDR in den Anzeigeeinstellungen des Host-PCs ausschalten behebt das.","pt-BR":"Atenção: o HDR está ativo neste monitor no host, então as cores parecem mais claras do que são. Desativar o HDR nas configurações de tela do PC host resolve.","ru":"Внимание: на хосте для этого монитора включён HDR, поэтому цвета выглядят светлее, чем есть. Отключите HDR в параметрах дисплея ПК-хоста.","vi":"Lưu ý: màn hình này đang bật HDR trên máy chủ nên màu trông sáng hơn thực tế. Tắt HDR trong cài đặt màn hình của máy chủ là xong.","id":"Perhatian: HDR aktif untuk monitor ini di host, jadi warnanya tampak lebih terang dari aslinya. Matikan HDR di pengaturan layar PC host untuk memperbaikinya."},"새 창으로 분리":{"en":"Open in a new window","ja":"新しいウィンドウに分離","zh-CN":"拆分到新窗口","zh-TW":"拆分到新視窗","es":"Abrir en una ventana nueva","fr":"Ouvrir dans une nouvelle fenêtre","de":"In neuem Fenster öffnen","pt-BR":"Abrir em nova janela","ru":"Открыть в новом окне","vi":"Tách ra cửa sổ mới","id":"Buka di jendela baru"},"모든 모니터를 실제 배치대로 한 창에":{"en":"All monitors in one window, as they are arranged","ja":"すべてのモニターを実際の配置どおりに1つのウィンドウへ","zh-CN":"在一个窗口中按实际布局显示所有显示器","zh-TW":"在一個視窗中按實際配置顯示所有螢幕","es":"Todos los monitores en una ventana, tal como están colocados","fr":"Tous les écrans dans une fenêtre, tels qu'ils sont disposés","de":"Alle Monitore in eine des écrans de ce PC. Pour en utiliser plusieurs, accordez l'autorisation avec le bouton ci-dessous.","de":"Dieser Browser meldet nur einen der Monitore dieses PCs. Um mehrere zu nutzen, erteilen Sie die Berechtigung mit der Schaltfläche unten.","pt-BR":"Este navegador informa só um dos monitores deste PC. Para usar vários, conceda a permissão com o botão abaixo.","ru":"Этот браузер сообщает только об одном мониторе этого ПК. Чтобы использовать несколько, дайте разрешение кнопкой ниже.","vi":"Trình duyệt này chỉ báo một màn hình của máy này. Để dùng nhiều màn hình, hãy cấp quyền bằng nút bên dưới.","id":"Peramban ini hanya melaporkan satu monitor PC ini. Untuk memakai beberapa monitor, berikan izin dengan tombol di bawah."},"다른 모니터의 창이 팝업 차단으로 열리지 못했습니다. 주소창에서 이 페이지의 팝업을 허용한 뒤 모니터를 다시 놓아 주세요.":{"en":"The window for the other monitor couldn't open because pop-ups are blocked. Allow pop-ups for this page from the address bar, then drop the monitor again.","ja":"ポップアップのブロックにより、ほかのモニターのウィンドウを開けませんでした。アドレスバーでこのページのポップアップを許可してから、モニターをもう一度ドロップしてください。","zh-CN":"由于弹出窗口被拦截，其他显示器的窗口未能打开。请在地址栏中允许此页面的弹出窗口，然后重新放置显示器。","zh-TW":"由於彈出式視窗被封鎖，其他螢幕的視窗未能開啟。請在網址列中允許此頁面的彈出式視窗，然後重新放置螢幕。","es":"La ventana del otro monitor no se pudo abrir porque las ventanas emergentes están bloqueadas. Permítelas para esta página en la barra de direcciones y vuelve a soltar el monitor.","fr":"La fenêtre de l'autre écran n'a pas pu s'ouvrir car les pop-ups sont bloqués. Autorisez-les pour cette page dans la barre d'adresse, puis déposez à nouveau l'écran.","de":"Das Fenster für den anderen Monitor konnte wegen des Pop-up-Blockers nicht geöffnet werden. Erlauben Sie Pop-ups für diese Seite in der Adressleiste und legen Sie den Monitor erneut ab.","pt-BR":"A janela do outro monitor não abriu porque os pop-ups estão bloqueados. Permita pop-ups desta página na barra de endereço e solte o monitor de novo.","ru":"Окно другого монитора не открылось из-за блокировки всплывающих окон. Разрешите их для этой страницы в адресной строке и перетащите монитор снова.","vi":"Cửa sổ của màn hình kia không mở được do bị chặn cửa sổ bật lên. Hãy cho phép cửa sổ bật lên cho trang này trên thanh địa chỉ rồi thả lại màn hình.","id":"Jendela monitor lain tidak bisa terbuka karena pop-up diblokir. Izinkan pop-up untuk halaman ini dari bilah alamat, lalu lepas monitornya lagi."},"창이 팝업 차단으로 열리지 못했습니다. 주소창에서 이 페이지의 팝업을 허용한 뒤 다시 놓아 주세요.":{"en":"The window couldn't open because pop-ups are blocked. Allow pop-ups for this page from the address bar, then drop it again.","ja":"ポップアップのブロックにより、ウィンドウを開けませんでした。アドレスバーでこのページのポップアップを許可してから、もう一度ドロップしてください。","zh-CN":"由于弹出窗口被拦截，窗口未能打开。请在地址栏中允许此页面的弹出窗口，然后重新放置。","zh-TW":"由於彈出式視窗被封鎖，視窗未能開啟。請在網址列中允許此頁面的彈出式視窗，然後重新放置。","es":"La ventana no se pudo abrir porque las ventanas emergentes están bloqueadas. Permítelas para esta página en la barra de direcciones y vuelve a soltar.","fr":"La fenêtre n'a pas pu s'ouvrir car les pop-ups sont bloqués. Autorisez-les pour cette page dans la barre d'adresse, puis déposez à nouveau.","de":"Das Fenster konnte wegen des Pop-up-Blockers nicht geöffnet werden. Erlauben Sie Pop-ups für diese Seite in der Adressleiste und legen Sie erneut ab.","pt-BR":"A janela não abriu porque os pop-ups estão bloqueados. Permita pop-ups desta página na barra de endereço e solte de novo.","ru":"Окно не открылось из-за блокировки всплывающих окон. Разрешите их для этой страницы в адресной строке и перетащите снова.","vi":"Cửa sổ không mở được do bị chặn cửa sổ bật lên. Hãy cho phép cửa sổ bật lên cho trang này trên thanh địa chỉ rồi thả lại.","id":"Jendela tidak bisa terbuka karena pop-up diblokir. Izinkan pop-up untuk halaman ini dari bilah alamat, lalu lepas lagi."},"함께 표시":{"en":"Shown together","ja":"一緒に表示","zh-CN":"一起显示","zh-TW":"一起顯示","es":"Mostrados juntos","fr":"Affichés ensemble","de":"Zusammen angezeigt","pt-BR":"Mostrados juntos","ru":"Показаны вместе","vi":"Hiện cùng nhau","id":"Ditampilkan bersama"},"호스트 PC가 잠겨 있습니다":{"en":"The host PC is locked","ja":"ホストPCはロックされています","zh-CN":"主机电脑已锁定","zh-TW":"主機電腦已鎖定","es":"El PC host está bloqueado","fr":"Le PC hôte est verrouillé","de":"Der Host-PC ist gesperrt","pt-BR":"O PC host está bloqueado","ru":"ПК-хост заблокирован","vi":"Máy chủ đang bị khóa","id":"PC host terkunci"},"잠금 화면은 원격으로 보이지도 조작되지도 않습니다. 호스트 PC 앞에서 잠금을 풀면 화면이 이어집니다. (Windows 호스트는 호스트 창에서 \"잠금 화면에서도 원격 조종\"을 설치하면 원격에서 풀 수 있습니다.)":{"en":"The lock screen can't be seen or controlled remotely. Unlock it at the host PC and the picture continues. (On a Windows host, installing “Remote control on the lock screen” in the host window lets you unlock it remotely.)","ja":"ロック画面はリモートでは表示も操作もできません。ホストPCの前でロックを解除すると、画面が続きます。（Windows ホストでは、ホストの画面で「ロック画面でもリモート操作」をインストールすれば、リモートから解除できます。）","zh-CN":"锁屏界面无法远程查看或操作。在主机电脑前解锁后，画面会继续。（Windows 主机在主机窗口中安装“锁屏时也能远程控制”后，即可远程解锁。）","zh-TW":"鎖定畫面無法從遠端檢視或操作。在主機電腦前解除鎖定後，畫面會繼續。（Windows 主機在主機視窗中安裝「鎖定畫面時也能遠端控制」後，即可從遠端解除鎖定。）","es":"La pantalla de bloqueo no se puede ver ni controlar en remoto. Desbloquéala en el PC host y la imagen continuará. (En un host con Windows, si instalas «Control remoto también en la pantalla de bloqueo» desde la ventana del host, podrás desbloquearlo en remoto).","fr":"L'écran de verrouillage ne peut être ni vu ni contrôlé à distance. Déverrouillez-le sur le PC hôte et l'image reprend. (Sur un hôte Windows, installer « Contrôle à distance même sur l'écran de verrouillage » dans la fenêtre de l'hôte permet de le déverrouiller à distance.)","de":"Der Sperrbildschirm lässt sich aus der Ferne weder sehen noch bedienen. Entsperren Sie am Host-PC, dann geht das Bild weiter. (Auf einem Windows-Host lässt er sich aus der Ferne entsperren, wenn im Host-Fenster „Fernsteuerung auch am Sperrbildschirm“ installiert ist.)","pt-BR":"A tela de bloqueio não pode ser vista nem controlada remotamente. Desbloqueie no PC host e a imagem continua. (Num host Windows, instalar “Controle remoto também na tela de bloqueio” na janela do host permite desbloquear remotamente.)","ru":"Экран блокировки нельзя ни видеть, ни управлять им удалённо. Разблокируйте ПК-хост на месте, и изображение продолжится. (На хосте с Windows можно установить в окне хоста «Удалённое управление и на экране блокировки» — тогда разблокировать можно удалённо.)","vi":"Không thể xem hay điều khiển màn hình khóa từ xa. Mở khóa ngay tại máy chủ thì hình sẽ tiếp tục. (Với máy chủ Windows, cài “Điều khiển từ xa cả ở màn hình khóa” trong cửa sổ máy chủ thì có thể mở khóa từ xa.)","id":"Layar kunci tidak bisa dilihat atau dikendalikan dari jarak jauh. Buka kuncinya langsung di PC host dan gambar akan berlanjut. (Pada host Windows, memasang “Kontrol jarak jauh juga di layar kunci” di jendela host memungkinkan membukanya dari jarak jauh.)"},"지금은 호스트 화면을 볼 수 없습니다":{"en":"The host's screen can't be shown right now","ja":"現在はホストの画面を表示できません","zh-CN":"暂时无法查看主机画面","zh-TW":"暫時無法檢視主機畫面","es":"Ahora no se puede ver la pantalla del host","fr":"L'écran de l'hôte ne peut pas être affiché pour l'instant","de":"Der Bildschirm des Hosts ist gerade nicht zu sehen","pt-BR":"Não é possível ver a tela do host agora","ru":"Сейчас экран хоста недоступен","vi":"Hiện không xem được màn hình máy chủ","id":"Layar host tidak bisa ditampilkan saat ini"},"권한 확인 창(UAC)이나 잠금 화면 같은 보안 화면은 원격으로 보이지도 조작되지도 않습니다. 호스트 PC 앞에서 직접 응답해야 합니다.":{"en":"Secure screens such as a permission prompt (UAC) or the lock screen can't be seen or controlled remotely. Someone has to respond at the host PC.","ja":"権限の確認画面（UAC）やロック画面などのセキュリティ画面は、リモートでは表示も操作もできません。ホストPCの前で直接応答する必要があります。","zh-CN":"权限确认窗口（UAC）或锁屏界面等安全界面无法远程查看或操作，需要在主机电脑前亲自响应。","zh-TW":"權限確認視窗（UAC）或鎖定畫面等安全畫面無法從遠端檢視或操作，需要在主機電腦前親自回應。","es":"Las pantallas seguras, como la ventana de permisos (UAC) o la pantalla de bloqueo, no se pueden ver ni controlar en remoto. Hay que responder delante del PC host.","fr":"Les écrans sécurisés, comme une demande d'autorisation (UAC) ou l'écran de verrouillage, ne peuvent être ni vus ni contrôlés à distance. Il faut y répondre devant le PC hôte.","de":"Sichere Bildschirme wie eine Berechtigungsabfrage (UAC) oder der Sperrbildschirm lassen sich aus der Ferne weder sehen noch bedienen. Jemand muss am Host-PC antworten.","pt-BR":"Telas seguras, como a janela de permissão (UAC) ou a tela de bloqueio, não podem ser vistas nem controladas remotamente. É preciso responder na frente do PC host.","ru":"Защищённые экраны — окно подтверждения прав (UAC) или экран блокировки — нельзя ни видеть, ни управлять ими удалённо. Ответить нужно за самим ПК-хостом.","vi":"Các màn hình bảo mật như hộp thoại xác nhận quyền (UAC) hay màn hình khóa không xem hay điều khiển được từ xa. Phải trả lời ngay tại máy chủ.","id":"Layar aman seperti jendela izin (UAC) atau layar kunci tidak bisa dilihat atau dikendalikan dari jarak jauh. Harus dijawab langsung di PC host."},"잠금 화면은 모니터 {0}에 보입니다. 그 화면에서 비밀번호를 입력해 잠금을 풀 수 있습니다.":{"en":"The lock screen is on monitor {0}. You can type the password there to unlock it.","ja":"ロック画面はモニター {0} に表示されています。その画面でパスワードを入力してロックを解除できます。","zh-CN":"锁屏界面显示在显示器 {0} 上。可以在那个画面中输入密码解锁。","zh-TW":"鎖定畫面顯示在螢幕 {0} 上。可以在那個畫面中輸入密碼解除鎖定。","es":"La pantalla de bloqueo está en el monitor {0}. Puedes escribir allí la contraseña para desbloquearlo.","fr":"L'écran de verrouillage est sur l'écran {0}. Vous pouvez y saisir le mot de passe pour déverrouiller.","de":"Der Sperrbildschirm ist auf Monitor {0}. Dort können Sie das Passwort eingeben, um zu entsperren.","pt-BR":"A tela de bloqueio está no monitor {0}. Você pode digitar a senha ali para desbloquear.","ru":"Экран блокировки на мониторе {0}. Там можно ввести пароль и разблокировать.","vi":"Màn hình khóa đang ở màn hình {0}. Có thể nhập mật khẩu ở đó để mở khóa.","id":"Layar kunci ada di monitor {0}. Anda bisa mengetik kata sandi di sana untuk membukanya."},"호스트에 권한 확인 창(UAC)이 떠 있습니다":{"en":"A permission prompt (UAC) is open on the host","ja":"ホストに権限の確認画面（UAC）が表示されています","zh-CN":"主机上弹出了权限确认窗口（UAC）","zh-TW":"主機上跳出了權限確認視窗（UAC）","es":"Hay una ventana de permisos (UAC) abierta en el host","fr":"Une demande d'autorisation (UAC) est ouverte sur l'hôte","de":"Auf dem Host ist eine Berechtigungsabfrage (UAC) offen","pt-BR":"Há uma janela de permissão (UAC) aberta no host","ru":"На хосте открыто окно подтверждения прав (UAC)","vi":"Máy chủ đang hiện hộp thoại xác nhận quyền (UAC)","id":"Ada jendela izin (UAC) terbuka di host"},"모니터 {0}에 보입니다. 원격에서는 보기만 할 수 있고, 응답은 호스트 PC 앞에서 해야 합니다.":{"en":"It is on monitor {0}. Remotely it can only be viewed; someone has to respond at the host PC.","ja":"モニター {0} に表示されています。リモートでは見ることしかできず、応答はホストPCの前で行う必要があります。","zh-CN":"显示在显示器 {0} 上。远程只能查看，需要在主机电脑前响应。","zh-TW":"顯示在螢幕 {0} 上。遠端只能檢視，需要在主機電腦前回應。","es":"Está en el monitor {0}. En remoto solo se puede ver; hay que responder delante del PC host.","fr":"Elle est sur l'écran {0}. À distance, elle est seulement visible ; il faut y répondre devant le PC hôte.","de":"Sie ist auf Monitor {0}. Aus der Ferne nur sichtbar; jemand muss am Host-PC antworten.","pt-BR":"Está no monitor {0}. Remotamente só dá para ver; é preciso responder na frente do PC host.","ru":"Оно на мониторе {0}. Удалённо его можно только видеть, ответить нужно за самим ПК-хостом.","vi":"Đang hiện ở màn hình {0}. Từ xa chỉ xem được, phải trả lời ngay tại máy chủ.","id":"Ada di monitor {0}. Dari jarak jauh hanya bisa dilihat; harus dijawab langsung di PC host."},"호스트의 잠금 화면에 Ctrl+Alt+Del을 보냅니다 (이 키는 이 PC가 먼저 가져가서 직접 누를 수 없습니다)":{"en":"Sends Ctrl+Alt+Del to the host's lock screen (this PC keeps that key combination for itself, so you can't press it directly)","ja":"ホストのロック画面に Ctrl+Alt+Del を送ります（このキーはこのPCが先に受け取るため、直接押すことはできません）","zh-CN":"向主机的锁屏界面发送 Ctrl+Alt+Del（此组合键会先被本机截获，无法直接按）","zh-TW":"向主機的鎖定畫面傳送 Ctrl+Alt+Del（此組合鍵會先被本機攔截，無法直接按）","es":"Envía Ctrl+Alt+Supr a la pantalla de bloqueo del host (este PC se queda con esa combinación, así que no puedes pulsarla directamente)","fr":"Envoie Ctrl+Alt+Suppr à l'écran de verrouillage de l'hôte (ce PC garde cette combinaison pour lui, impossible de la taper directement)","de":"Sendet Strg+Alt+Entf an den Sperrbildschirm des Hosts (diese Kombination behält dieser PC für sich, Sie können sie nicht direkt drücken)","pt-BR":"Envia Ctrl+Alt+Del para a tela de bloqueio do host (este PC fica com essa combinação, então não dá para pressioná-la diretamente)","ru":"Отправляет Ctrl+Alt+Del на экран блокировки хоста (это сочетание перехватывает этот ПК, нажать его напрямую нельзя)","vi":"Gửi Ctrl+Alt+Del tới màn hình khóa của máy chủ (tổ hợp này bị máy này giữ lại nên không bấm trực tiếp được)","id":"Mengirim Ctrl+Alt+Del ke layar kunci host (kombinasi ini ditangkap PC ini lebih dulu, jadi tidak bisa ditekan langsung)"},"Ctrl+Alt+Del을 보냈습니다":{"en":"Ctrl+Alt+Del sent","ja":"Ctrl+Alt+Del を送りました","zh-CN":"已发送 Ctrl+Alt+Del","zh-TW":"已傳送 Ctrl+Alt+Del","es":"Ctrl+Alt+Supr enviado","fr":"Ctrl+Alt+Suppr envoyé","de":"Strg+Alt+Entf gesendet","pt-BR":"Ctrl+Alt+Del enviado","ru":"Ctrl+Alt+Del отправлено","vi":"Đã gửi Ctrl+Alt+Del","id":"Ctrl+Alt+Del terkirim"},"호스트 잠금 화면 — 비밀번호를 입력해 풀 수 있습니다":{"en":"Host lock screen — type the password to unlock","ja":"ホストのロック画面 — パスワードを入力して解除できます","zh-CN":"主机锁屏界面 — 可输入密码解锁","zh-TW":"主機鎖定畫面 — 可輸入密碼解除鎖定","es":"Pantalla de bloqueo del host: escribe la contraseña para desbloquear","fr":"Écran de verrouillage de l'hôte — saisissez le mot de passe pour déverrouiller","de":"Sperrbildschirm des Hosts – Passwort eingeben zum Entsperren","pt-BR":"Tela de bloqueio do host — digite a senha para desbloquear","ru":"Экран блокировки хоста — введите пароль для разблокировки","vi":"Màn hình khóa của máy chủ — nhập mật khẩu để mở khóa","id":"Layar kunci host — ketik kata sandi untuk membuka"},"권한 확인 창(UAC) — 원격에서는 보기만 됩니다":{"en":"Permission prompt (UAC) — view only from here","ja":"権限の確認画面（UAC）— リモートでは表示のみ","zh-CN":"权限确认窗口（UAC）— 远程只能查看","zh-TW":"權限確認視窗（UAC）— 遠端只能檢視","es":"Ventana de permisos (UAC): en remoto solo se ve","fr":"Demande d'autorisation (UAC) — seulement visible à distance","de":"Berechtigungsabfrage (UAC) – aus der Ferne nur sichtbar","pt-BR":"Janela de permissão (UAC) — remotamente só dá para ver","ru":"Окно подтверждения прав (UAC) — удалённо только просмотр","vi":"Hộp thoại xác nhận quyền (UAC) — từ xa chỉ xem được","id":"Jendela izin (UAC) — dari jarak jauh hanya bisa dilihat"},"이 PC를 호스트에 기기로 등록했습니다. 다음부터는 키 없이 접속합니다":{"en":"This PC is now registered with the host as a device. From now on it connects without the key","ja":"このPCをホストにデバイスとして登録しました。次回からはキーなしで接続します","zh-CN":"已将本机注册为主机的设备。以后无需密钥即可连接","zh-TW":"已將本機註冊為主機的裝置。之後不需金鑰即可連線","es":"Este PC quedó registrado en el host como dispositivo. A partir de ahora se conecta sin la clave","fr":"Ce PC est maintenant enregistré comme appareil sur l'hôte. Il se connectera désormais sans la clé","de":"Dieser PC ist jetzt beim Host als Gerät registriert. Ab jetzt verbindet er sich ohne Schlüssel","pt-BR":"Este PC foi registrado no host como dispositivo. A partir de agora conecta sem a chave","ru":"Этот ПК зарегистрирован на хосте как устройство. Теперь он подключается без ключа","vi":"Đã đăng ký máy này làm thiết bị với máy chủ. Từ nay kết nối không cần khóa","id":"PC ini sudah didaftarkan ke host sebagai perangkat. Mulai sekarang tersambung tanpa kunci"},"이 PC는 호스트에서 차단되었습니다. 호스트 PC의 \"접속한 기기\"에서 차단을 풀 수 있습니다.":{"en":"This PC is blocked on the host. It can be unblocked under “Registered devices” on the host PC.","ja":"このPCはホストでブロックされています。ホストPCの「登録済みデバイス」でブロックを解除できます。","zh-CN":"本机已被主机阻止。可以在主机电脑的“已注册设备”中解除阻止。","zh-TW":"本機已被主機封鎖。可以在主機電腦的「已註冊裝置」中解除封鎖。","es":"Este PC está bloqueado en el host. Se puede desbloquear en «Dispositivos registrados» del PC host.","fr":"Ce PC est bloqué sur l'hôte. Il peut être débloqué dans « Appareils enregistrés » sur le PC hôte.","de":"Dieser PC ist beim Host gesperrt. Unter „Registrierte Geräte“ am Host-PC lässt sich das aufheben.","pt-BR":"Este PC está bloqueado no host. Dá para desbloquear em “Dispositivos registrados” no PC host.","ru":"Этот ПК заблокирован на хосте. Снять блокировку можно в разделе «Зарегистрированные устройства» на ПК-хосте.","vi":"Máy này đã bị chặn trên máy chủ. Có thể bỏ chặn ở mục “Thiết bị đã đăng ký” trên máy chủ.","id":"PC ini diblokir di host. Blokirnya bisa dibuka di “Perangkat terdaftar” pada PC host."},"호스트에서 이 접속을 거부했습니다.":{"en":"The host denied this connection.","ja":"ホストがこの接続を拒否しました。","zh-CN":"主机拒绝了此连接。","zh-TW":"主機拒絕了此連線。","es":"El host rechazó esta conexión.","fr":"L'hôte a refusé cette connexion.","de":"Der Host hat diese Verbindung abgelehnt.","pt-BR":"O host recusou esta conexão.","ru":"Хост отклонил это подключение.","vi":"Máy chủ đã từ chối kết nối này.","id":"Host menolak sambungan ini."},"호스트에서 2분 안에 허용하지 않았습니다. 다시 접속해 보세요.":{"en":"The host didn't allow it within 2 minutes. Try connecting again.","ja":"ホストで2分以内に許可されませんでした。もう一度接続してみてください。","zh-CN":"主机在 2 分钟内没有允许。请重新连接试试。","zh-TW":"主機在 2 分鐘內沒有允許。請重新連線試試。","es":"El host no lo permitió en 2 minutos. Vuelve a intentar conectarte.","fr":"L'hôte n'a pas autorisé dans les 2 minutes. Réessayez de vous connecter.","de":"Der Host hat nicht innerhalb von 2 Minuten zugelassen. Versuchen Sie es erneut.","pt-BR":"O host não permitiu em 2 minutos. Tente conectar de novo.","ru":"Хост не разрешил подключение в течение 2 минут. Попробуйте подключиться снова.","vi":"Máy chủ không cho phép trong vòng 2 phút. Hãy thử kết nối lại.","id":"Host tidak mengizinkan dalam 2 menit. Coba sambungkan lagi."},"다른 기기가 호스트의 허용을 기다리고 있거나, 요청이 너무 잦습니다. 잠시 뒤 다시 접속해 보세요.":{"en":"Another device is waiting for the host to allow it, or requests are too frequent. Try again in a moment.","ja":"ほかのデバイスがホストの許可を待っているか、要求が多すぎます。少したってからもう一度接続してみてください。","zh-CN":"有其他设备正在等待主机允许，或请求过于频繁。请稍后再试。","zh-TW":"有其他裝置正在等待主機允許，或要求過於頻繁。請稍後再試。","es":"Otro dispositivo está esperando a que el host lo permita, o hay demasiadas solicitudes. Vuelve a intentarlo en un momento.","fr":"Un autre appareil attend l'autorisation de l'hôte, ou les demandes sont trop fréquentes. Réessayez dans un instant.","de":"Ein anderes Gerät wartet auf Zulassung durch den Host, oder es kommen zu viele Anfragen. Versuchen Sie es gleich noch einmal.","pt-BR":"Outro dispositivo está aguardando a permissão do host, ou os pedidos estão frequentes demais. Tente de novo daqui a pouco.","ru":"Другое устройство ждёт разрешения хоста, или запросы слишком часты. Попробуйте чуть позже.","vi":"Thiết bị khác đang chờ máy chủ cho phép, hoặc yêu cầu quá dày. Hãy thử lại sau giây lát.","id":"Perangkat lain sedang menunggu izin host, atau permintaan terlalu sering. Coba lagi sebentar lagi."},"코드를 여러 번 틀려 OTP 확인이 잠시 막혔습니다. 호스트에서 허용하거나 나중에 다시 시도하세요.":{"en":"Too many wrong codes: code checks are paused for a while. Have the host allow you, or try again later.","ja":"コードを何度も間違えたため、コードの確認が一時停止されました。ホストで許可してもらうか、後でもう一度お試しください。","zh-CN":"代码错误次数过多，代码验证已暂停。请让主机允许，或稍后再试。","zh-TW":"代碼錯誤次數過多，代碼驗證已暫停。請讓主機允許，或稍後再試。","es":"Demasiados códigos incorrectos: la comprobación se pausa un rato. Pide que te permitan desde el host o inténtalo más tarde.","fr":"Trop de codes erronés : la vérification des codes est suspendue un moment. Faites-vous autoriser depuis l'hôte, ou réessayez plus tard.","de":"Zu viele falsche Codes: Die Code-Prüfung ist kurz gesperrt. Lassen Sie sich am Host zulassen oder versuchen Sie es später.","pt-BR":"Códigos errados demais: a verificação foi pausada por um tempo. Peça a permissão no host ou tente mais tarde.","ru":"Слишком много неверных кодов: проверка временно приостановлена. Попросите разрешить на хосте или попробуйте позже.","vi":"Nhập sai mã quá nhiều lần nên tạm khóa việc kiểm tra mã. Hãy nhờ máy chủ cho phép, hoặc thử lại sau.","id":"Terlalu banyak kode salah: pemeriksaan kode dijeda sebentar. Minta izin dari host, atau coba lagi nanti."},"이 화면이 호스트와 맞지 않습니다. 다시 접속해 보세요.":{"en":"This page doesn't match the host. Try connecting again.","ja":"この画面はホストと一致しません。もう一度接続してみてください。","zh-CN":"此界面与主机不匹配。请重新连接试试。","zh-TW":"此畫面與主機不相符。請重新連線試試。","es":"Esta página no coincide con el host. Vuelve a intentar conectarte.","fr":"Cette page ne correspond pas à l'hôte. Réessayez de vous connecter.","de":"Diese Seite passt nicht zum Host. Versuchen Sie es erneut.","pt-BR":"Esta página não corresponde ao host. Tente conectar de novo.","ru":"Эта страница не соответствует хосту. Попробуйте подключиться снова.","vi":"Giao diện này không khớp với máy chủ. Hãy thử kết nối lại.","id":"Halaman ini tidak cocok dengan host. Coba sambungkan lagi."},"이 1회용 코드는 이미 다른 접속에 쓰였습니다. 호스트 PC에서 새 코드를 받으세요.":{"en":"This one-time code was already used by another connection. Get a new code from the host PC.","ja":"このワンタイムコードはすでに別の接続で使われました。ホストPCから新しいコードをもらってください。","zh-CN":"此一次性代码已被其他连接使用。请从主机电脑获取新代码。","zh-TW":"此一次性代碼已被其他連線使用。請從主機電腦取得新代碼。","es":"Este código de un solo uso ya se usó en otra conexión. Pide un código nuevo en el PC host.","fr":"Ce code à usage unique a déjà servi pour une autre connexion. Demandez un nouveau code sur le PC hôte.","de":"Dieser Einmalcode wurde schon für eine andere Verbindung verwendet. Holen Sie sich am Host-PC einen neuen.","pt-BR":"Este código de uso único já foi usado em outra conexão. Peça um código novo no PC host.","ru":"Этот одноразовый код уже использован другим подключением. Получите новый код на ПК-хосте.","vi":"Mã dùng một lần này đã được dùng cho kết nối khác. Hãy lấy mã mới từ máy chủ.","id":"Kode sekali pakai ini sudah dipakai sambungan lain. Minta kode baru dari PC host."},"이 PC 자신에는 접속할 수 없습니다. 자기 화면을 끝없이 비추고, 누른 키와 클릭이 이 PC로 되돌아옵니다. 다른 PC의 키나 코드인지 확인하세요.":{"en":"You can't connect to this PC itself: it would show its own screen endlessly, and every key and click would come back to it. Check that the key or code is another PC's.","ja":"このPC自身には接続できません。自分の画面を延々と映し、押したキーやクリックがこのPCに戻ってきます。ほかのPCのキーやコードか確認してください。","zh-CN":"无法连接到本机自身：画面会无限映出自己，按键和点击也会绕回本机。请确认这是其他电脑的密钥或代码。","zh-TW":"無法連線到本機自身：畫面會無限映出自己，按鍵和點按也會繞回本機。請確認這是其他電腦的金鑰或代碼。","es":"No puedes conectarte a este mismo PC: mostraría su propia pantalla sin fin y cada tecla y clic volvería a él. Comprueba que la clave o el código sean de otro PC.","fr":"Impossible de se connecter à ce PC lui-même : il afficherait son propre écran à l'infini, et chaque touche et clic lui reviendrait. Vérifiez que la clé ou le code est celui d'un autre PC.","de":"Mit diesem PC selbst kann man sich nicht verbinden: Er würde seinen eigenen Bildschirm endlos zeigen, und jede Taste und jeder Klick käme zu ihm zurück. Prüfen Sie, ob Schlüssel oder Code zu einem anderen PC gehören.","pt-BR":"Não é possível conectar a este próprio PC: ele mostraria a própria tela sem fim, e cada tecla e clique voltaria para ele. Confira se a chave ou o código é de outro PC.","ru":"Подключиться к самому этому ПК нельзя: он бесконечно показывал бы свой экран, а каждое нажатие и щелчок возвращались бы к нему. Убедитесь, что ключ или код от другого ПК.","vi":"Không thể kết nối vào chính máy này: màn hình sẽ tự phản chiếu vô tận và mọi phím, cú nhấp đều dội về máy này. Hãy kiểm tra đó là khóa hoặc mã của máy khác.","id":"Tidak bisa tersambung ke PC ini sendiri: layarnya akan memantul tanpa henti dan setiap tombol serta klik kembali ke PC ini. Pastikan kunci atau kodenya milik PC lain."},"이 PC는 지금 접속하려는 PC를 조종하고 있습니다. 두 PC가 서로를 조종하면 키와 클릭이 둘 사이를 끝없이 오가므로 막았습니다. 한쪽 접속을 끊고 다시 시도하세요.":{"en":"This PC is controlling the PC you are trying to connect to. If two PCs control each other, keys and clicks bounce between them endlessly, so this was blocked. End one of the connections and try again.","ja":"このPCは、接続しようとしているPCを今操作しています。2台が互いを操作するとキーやクリックが延々と行き来するため、ブロックしました。どちらかの接続を切ってからもう一度お試しください。","zh-CN":"本机正在控制你要连接的那台电脑。两台电脑互相控制会让按键和点击在它们之间无限往返，因此已阻止。请断开其中一个连接后再试。","zh-TW":"本機正在控制你要連線的那台電腦。兩台電腦互相控制會讓按鍵和點按在它們之間無限往返，因此已封鎖。請中斷其中一個連線後再試。","es":"Este PC está controlando el PC al que intentas conectarte. Si dos PC se controlan mutuamente, las teclas y los clics van y vienen entre ellos sin fin, así que se bloqueó. Cierra una de las conexiones y vuelve a intentarlo.","fr":"Ce PC contrôle le PC auquel vous essayez de vous connecter. Si deux PC se contrôlent mutuellement, touches et clics font des allers-retours sans fin : c'est donc bloqué. Coupez l'une des connexions et réessayez.","de":"Dieser PC steuert gerade den PC, mit dem Sie sich verbinden wollen. Steuern sich zwei PCs gegenseitig, pendeln Tasten und Klicks endlos hin und her; daher blockiert. Trennen Sie eine der Verbindungen und versuchen Sie es erneut.","pt-BR":"Este PC está controlando o PC ao qual você tenta se conectar. Se dois PCs se controlam, teclas e cliques ficam indo e voltando sem fim, por isso foi bloqueado. Encerre uma das conexões e tente de novo.","ru":"Этот ПК сейчас управляет тем ПК, к которому вы подключаетесь. Если два ПК управляют друг другом, нажатия и щелчки бесконечно ходят между ними, поэтому подключение заблокировано. Разорвите одно из подключений и попробуйте снова.","vi":"Máy này đang điều khiển chính máy bạn muốn kết nối. Nếu hai máy điều khiển lẫn nhau, phím và cú nhấp sẽ dội qua lại vô tận nên đã bị chặn. Hãy ngắt một trong hai kết nối rồi thử lại.","id":"PC ini sedang mengendalikan PC yang ingin Anda sambungkan. Jika dua PC saling mengendalikan, tombol dan klik akan bolak-balik tanpa henti, jadi diblokir. Putuskan salah satu sambungan lalu coba lagi."},"호스트에서 허용하지 않았습니다.":{"en":"The host didn't allow it.","ja":"ホストで許可されませんでした。","zh-CN":"主机没有允许。","zh-TW":"主機沒有允許。","es":"El host no lo permitió.","fr":"L'hôte n'a pas autorisé la connexion.","de":"Der Host hat nicht zugelassen.","pt-BR":"O host não permitiu.","ru":"Хост не разрешил подключение.","vi":"Máy chủ không cho phép.","id":"Host tidak mengizinkan."},"휴대폰 인증 앱 코드를 여러 번 틀려 코드 확인이 잠시 막혀 있습니다. 호스트에서 허용을 누르세요.":{"en":"Too many wrong authenticator codes: code checks are paused for a while. Have Allow pressed on the host.","ja":"認証アプリのコードを何度も間違えたため、コードの確認が一時停止されています。ホストで「許可」を押してもらってください。","zh-CN":"验证器代码错误次数过多，代码验证暂时被锁定。请在主机上点“允许”。","zh-TW":"驗證器代碼錯誤次數過多，代碼驗證暫時被鎖定。請在主機上按「允許」。","es":"Demasiados códigos de autenticación incorrectos: la comprobación está en pausa un rato. Que pulsen Permitir en el host.","fr":"Trop de codes d'authentification erronés : la vérification est suspendue un moment. Faites appuyer sur Autoriser sur l'hôte.","de":"Zu viele falsche Authenticator-Codes: Die Code-Prüfung ist kurz gesperrt. Lassen Sie am Host „Zulassen“ drücken.","pt-BR":"Códigos do autenticador errados demais: a verificação está pausada por um tempo. Peça para tocarem em Permitir no host.","ru":"Слишком много неверных кодов аутентификатора: проверка временно приостановлена. Попросите нажать «Разрешить» на хосте.","vi":"Nhập sai mã ứng dụng xác thực quá nhiều lần nên tạm khóa việc kiểm tra mã. Hãy nhờ bấm Cho phép trên máy chủ.","id":"Terlalu banyak kode autentikator yang salah: pemeriksaan kode dijeda sebentar. Minta seseorang menekan Izinkan di host."},"확인하는 중…":{"en":"Checking…","ja":"確認しています…","zh-CN":"正在验证…","zh-TW":"正在驗證…","es":"Comprobando…","fr":"Vérification…","de":"Wird geprüft…","pt-BR":"Verificando…","ru":"Проверка…","vi":"Đang kiểm tra…","id":"Memeriksa…"},"보내지 못했습니다: {0}":{"en":"Couldn't send: {0}","ja":"送信できませんでした: {0}","zh-CN":"发送失败：{0}","zh-TW":"傳送失敗：{0}","es":"No se pudo enviar: {0}","fr":"Envoi impossible : {0}","de":"Senden fehlgeschlagen: {0}","pt-BR":"Não foi possível enviar: {0}","ru":"Не удалось отправить: {0}","vi":"Không gửi được: {0}","id":"Gagal mengirim: {0}"},"접속을 취소했습니다.":{"en":"Connection canceled.","ja":"接続を取り消しました。","zh-CN":"已取消连接。","zh-TW":"已取消連線。","es":"Conexión cancelada.","fr":"Connexion annulée.","de":"Verbindung abgebrochen.","pt-BR":"Conexão cancelada.","ru":"Подключение отменено.","vi":"Đã hủy kết nối.","id":"Sambungan dibatalkan."},"코드를 여러 번 틀려 코드 확인이 잠시 막혔습니다. 호스트에서 허용을 누르세요.":{"en":"Too many wrong codes: code checks are paused for a while. Have Allow pressed on the host.","ja":"コードを何度も間違えたため、コードの確認が一時停止されました。ホストで「許可」を押してもらってください。","zh-CN":"代码错误次数过多，代码验证已暂停。请在主机上点“允许”。","zh-TW":"代碼錯誤次數過多，代碼驗證已暫停。請在主機上按「允許」。","es":"Demasiados códigos incorrectos: la comprobación se pausa un rato. Que pulsen Permitir en el host.","fr":"Trop de codes erronés 면 \"전체화면\"을 누르세요":{"en":"The host was updated. To go back to full screen, press “Full screen”","ja":"ホストがアップデートされました。全画面表示に戻るには「全画面表示」を押してください","zh-CN":"主机已更新。要回到全屏，请点“全屏”","zh-TW":"主機已更新。要回到全螢幕，請按「全螢幕」","es":"El host se actualizó. Para volver a pantalla completa, pulsa «Pantalla completa»","fr":"L'hôte a été mis à jour. Pour revenir en plein écran, appuyez sur « Plein écran »","de":"Der Host wurde aktualisiert. Für das Vollbild „Vollbild“ drücken","pt-BR":"O host foi atualizado. Para voltar à tela cheia, toque em “Tela cheia”","ru":"Хост обновлён. Чтобы вернуться в полноэкранный режим, нажмите «Полный экран»","vi":"Máy chủ đã cập nhật. Để quay lại toàn màn hình, hãy bấm “Toàn màn hình”","id":"Host telah diperbarui. Untuk kembali ke layar penuh, tekan “Layar penuh”"},"호스트가 업데이트되어 새 클라이언트 화면을 받아옵니다…":{"en":"The host was updated; fetching the new client page…","ja":"ホストがアップデートされたため、新しいクライアント画面を取得しています…","zh-CN":"主机已更新，正在获取新的客户端界面…","zh-TW":"主機已更新，正在取得新的用戶端畫面…","es":"El host se actualizó; descargando la nueva página del cliente…","fr":"L'hôte a été mis à jour ; récupération de la nouvelle page client…","de":"Der Host wurde aktualisiert; die neue Client-Seite wird geladen…","pt-BR":"O host foi atualizado; buscando a nova página do cliente…","ru":"Хост обновлён; загружается новая страница клиента…","vi":"Máy chủ đã cập nhật; đang tải giao diện máy khách mới…","id":"Host telah diperbarui; mengambil halaman klien baru…"},"호스트의 모니터 {0}은 HDR이 켜져 있어 색이 실제보다 밝게 보입니다 (호스트 PC의 디스플레이 설정에서 끄면 해결)":{"en":"HDR is on for the host's monitor {0}, so colors look brighter than they are (turn it off in the host PC's display settings to fix it)","ja":"ホストのモニター {0} は HDR がオンのため、色が実際より明るく見えます（ホストPCのディスプレイ設定でオフにすると解決）","zh-CN":"主机的显示器 {0} 开启了 HDR，颜色看起来比实际更亮（在主机电脑的显示设置中关闭即可解决）","zh-TW":"主機的螢幕 {0} 開啟了 HDR，顏色看起來比實際更亮（在主機電腦的顯示器設定中關閉即可解決）","es":"El monitor {0} del host tiene HDR activado, así que los colores se ven más claros de lo que son (desactívalo en la configuración de pantalla del PC host)" rver eingetragen werden.","pt-BR":"Falha na conexão — as redes dos dois lados podem estar bloqueando a conexão direta (P2P). É preciso adicionar um servidor TURN nas configurações do host.","ru":"Сбой подключения — сети с обеих сторон, возможно, блокируют прямое соединение (P2P). В настройки хоста нужно добавить TURN-сервер.","vi":"Kết nối thất bại — mạng ở cả hai phía có thể đang chặn kết nối trực tiếp (P2P). Cần thêm máy chủ TURN vào cài đặt của máy chủ.","id":"Sambungan gagal — jaringan di kedua sisi mungkin memblokir sambungan langsung (P2P). Server TURN perlu ditambahkan ke pengaturan host."},"연결 수립 중…":{"en":"Establishing the connection…","ja":"接続を確立しています…","zh-CN":"正在建立连接…","zh-TW":"正在建立連線…","es":"Estableciendo la conexión…","fr":"Établissement de la connexion…","de":"Verbindung wird aufgebaut…","pt-BR":"Estabelecendo a conexão…","ru":"Установка соединения…","vi":"Đang thiết lập kết nối…","id":"Membangun sambungan…"},"시그널링 서버 연결 중…":{"en":"Connecting to the signaling server…","ja":"シグナリングサーバーに接続しています…","zh-CN":"正在连接信令服务器…","zh-TW":"正在連線信令伺服器…","es":"Conectando con el servidor de señalización…","fr":"Connexion au serveur de signalisation…","de":"Verbindung zum Signalisierungsserver…","pt-BR":"Conectando ao servidor de sinalização…","ru":"Подключение к серверу сигнализации…","vi":"Đang kết nối server tín hiệu…","id":"Menyambung ke server pensinyalan…"},"오류: {0}":{"en":"Error: {0}","ja":"エラー: {0}","zh-CN":"错误：{0}","zh-TW":"錯誤：{0}","es":"Error: {0}","fr":"Erreur : {0}","de":"Fehler: {0}","pt-BR":"Erro: {0}","ru":"Ошибка: {0}","vi":"Lỗi: {0}","id":"Kesalahan: {0}"},"호스트가 접속을 거부했습니다.":{"en":"The host refused the connection.","ja":"ホストが接続を拒否しました。","zh-CN":"主机拒绝了连接。","zh-TW":"主機拒絕了連線。","es":"El host rechazó la conexión.","fr":"L'hôte a refusé la connexion.","de":"Der Host hat die Verbindung abgelehnt.","pt-BR":"O host recusou a conexão.","ru":"Хост отклонил подключение.","vi":"Máy chủ đã từ chối kết nối.","id":"Host menolak sambungan."},"시그널링 서버에 연결할 수 없습니다":{"en":"Can't reach the signaling server","ja":"シグナリングサーバーに接続できません","zh-CN":"无法连接信令服务器","zh-TW":"無法連線信令伺服器","es":"No se puede conectar con el servidor de señalización","fr":"Impossible de joindre le serveur de signalisation","de":"Signalisierungsserver nicht erreichbar","pt-BR":"Não é possível alcançar o servidor de sinalização","ru":"Не удаётся подключиться к серверу сигнализации","vi":"Không kết nối được server tín hiệu","id":"Tidak bisa menjangkau server pensinyalan"},"호스트 응답 대기 중…":{"en":"Waiting for the host to answer…","ja":"ホストの応答を待っています…","zh-CN":"正在等待主机响应…","zh-TW":"正在等待主機回應…","es":"Esperando la respuesta del host…","fr":"En attente de la réponse de l'hôte…","de":"Warten auf Antwort des Hosts…","pt-BR":"Aguardando resposta do host…","ru":"Ожидание ответа хоста…","vi":"Đang chờ máy chủ phản hồi…","id":"Menunggu jawaban host…"},"호스트가 응답하지 않습니다. 1회용 코드가 만료되었거나 호스트에서 끝냈을 수 있습니다.":{"en":"The host isn't answering. The one-time code may have expired, or the host ended it.","ja":"ホストが応答しません。ワンタイムコードの期限が切れたか、ホストで終了された可能性があります。","zh-CN":"主机没有响应。一次性代码可能已过期，或已被主机结束。","zh-TW":"主機沒有回應。一次性代碼可能已過期，或已被主機結束。","es":"El host no responde. Puede que el código de un solo uso haya caducado o que el host lo haya terminado.","fr":"L'hôte ne répond pas. Le code à usage unique a peut-être expiré, ou l'hôte l'a arrêté.","de":"Der Host antwortet nicht. Der Einmalcode ist vielleicht abgelaufen, oder der Host hat ihn beendet.","pt-BR":"O host não responde. O código de uso único pode ter expirado ou o host o encerrou.","ru":"Хост не отвечает. Возможно, одноразовый код истёк или хост его отменил.","vi":"Máy chủ không phản hồi. Có thể mã dùng một lần đã hết hạn hoặc máy chủ đã kết thúc nó.","id":"Host tidak menjawab. Kode sekali pakai mungkin sudah kedaluwarsa, atau host telah mengakhirinya."},"호스트가 응답하지 않습니다. 호스트 프로그램 실행 여부와 키를 확인하세요.":{"en":"The host isn't answering. Check that the host program is running and that the key is right.","ja":"ホストが応答しません。ホストプログラムが実行中か、キーが正しいかを確認してください。","zh-CN":"主机没有响应。
