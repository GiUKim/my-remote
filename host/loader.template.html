<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Remote</title>
<style>
  html, body { height: 100%; margin: 0; background: #14171c; color: #e6e8eb; font: 14px/1.5 "Segoe UI", "Malgun Gothic", sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  .box { width: min(460px, 90vw); background: #1d2229; border: 1px solid #2c333d; border-radius: 10px; padding: 22px; }
  input[type=password] { width: 100%; box-sizing: border-box; font: 14px Consolas, monospace; padding: 8px; border-radius: 6px; border: 1px solid #3a4350; background: #0e1014; color: #fff; margin: 8px 0; }
  button { font: inherit; background: #2b6cff; color: #fff; border: 0; border-radius: 5px; padding: 8px 18px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #msg { color: #e0b341; min-height: 1.5em; margin-top: 8px; }
  small { color: #8b94a1; }
</style>
</head>
<body>
<div class="box">
  <h2 style="margin:0 0 6px">My Remote</h2>
  <small id="hint">호스트 프로그램에 표시된 접속 키를 입력하세요.</small>
  <input id="key" type="password" placeholder="접속 키" autocomplete="off" spellcheck="false">
  <div style="margin-top:12px"><button id="go">접속</button></div>
  <div id="msg"></div>
</div>
<script>
// LOADER. This file is handed to a client PC once and is meant to stay unchanged.
// It only (1) asks for the access key, (2) asks the host - over the same
// encrypted, key-authenticated signaling channel used for connecting - for the
// current client page, and (3) runs that page. The client therefore always
// matches the version of the host it connects to.
//
// Bootstrap protocol (keep stable, old loaders are out there):
//   loader -> host: { t: 'ver', sid, ts, have: <hash of cached page or ''> }
//   host -> loader: { t: 'app', sid, ts, hash, html? }   html omitted when have === hash
// In the client app a PC of its list may have a token of its own instead of the key (from 2026-11-16,
// window.mrShell.bootDevice): the same exchange on the token's own topics (RD.DEVICE). A host refuses a
// blocked token: { t: 'denied', sid, why }.
// Everything is wrapped in a function so nothing here collides with the page it loads.
(() => {
/*__SIGNAL_JS__*/
const SERVER = '__SERVER__';
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch {} },
};
const preset = location.hash.slice(1) || '__PRESET__';
const params = new URLSearchParams(preset);
const msg = (s) => { $('msg').textContent = s; };
let busy = false;
let device = null; // { id, secret, server }: this PC's token for that host (the client app)

async function launch(html, key, updated, sig) {
  // In the client app (from 2026-11-16 on): whether a release signed this page (the host sends the signed
  // statement with it). The app gives a page its powers (saving files, the clipboard, device tokens) only then.
  const app = window.mrShell && typeof window.mrShell.pageCheck === 'function' ? window.mrShell : null;
  let signed;
  if (app) { try { signed = (await app.pageCheck({ statement: sig && sig.statement, sig: sig && sig.sig, sha256: await digest(html) })) === true; } catch { signed = false; } }
  // Replace this document with the client page. The window object is kept, so the page can read __mrBoot.
  window.__mrBoot = { key: device ? '' : key, device: device || undefined, remember: false, preset, updated, signed };
  document.open();
  document.write(html);
  document.close();
}
// The host names its page by the first 20 hex digits of its SHA-256 (getClientApp in main.js).
// Fewer digits would be easy to match with a made-up page, so a shorter name is never trusted.
async function digest(html) {
  const d = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(html)));
  return Array.from(d, (x) => x.toString(16).padStart(2, '0')).join('');
}

// fresh: do not use the stored copy of the page.
async function go(fresh) {
  // Taken at once: in the client app a second start (its key put in by the app while this one started
  // from #auto) must not run alongside (two pages written into one document break the second).
  if (busy) return;
  busy = true; $('go').disabled = true;
  const fail = (text) => { busy = false; $('go').disabled = false; msg(text); };
  const key = $('key').value.trim();
  store.set('mr_key', null); // browsers no longer keep the key (2026-11-16): what an older loader kept goes
  let keys;
  try { keys = device ? await RD.derive(device.secret, RD.DEVICE) : await RD.derive(key); } catch (e) { fail('오류: ' + e.message); return; }
  const cached = fresh ? null : store.get('mr_app_html');
  const have = cached ? store.get('mr_app_hash') || '' : '';
  const sid = RD.rand(16);
  let done = false, chan = null;
  try {
    msg('호스트에 연결하는 중…');
    chan = RD.channel({
      server: SERVER, subTopic: keys.topicClient, pubTopic: keys.topicHost, rxKey: keys.h2c, txKey: keys.c2h,
      onMessage: async (m) => {
        if (done || !m || m.sid !== sid) return;
        if (m.t === 'denied') {
          done = true;
          chan.close();
          fail(m.why === 'blocked' ? '이 PC는 호스트에서 차단되었습니다. 호스트 PC의 "접속한 기기"에서 차단을 풀 수 있습니다.' : '호스트가 접속을 거부했습니다.');
          return;
        }
        if (m.t !== 'app') return;
        done = true;
        chan.close();
        const sig = m.sig && typeof m.sig === 'object' ? m.sig : null; // the release's signature of the page (the client app checks it)
        if (typeof m.html === 'string' && m.html.length > 1000) {
          store.set('mr_app_html', m.html);
          store.set('mr_app_hash', String(m.hash || ''));
          launch(m.html, key, true, sig);
        } else if (cached && m.hash === have) {
          // Other local files opened in this browser can share this storage, so the stored copy may
          // not be the page it claims to be. It gets the key only when its own hash is the host's;
          // otherwise the page is fetched anew.
          let same = false;
          try { same = have.length >= 20 && (await digest(cached)).startsWith(have); } catch {}
          if (same) launch(cached, key, false, sig);
          else { fail(''); go(true); }
        } else {
          fail('호스트에서 클라이언트 화면을 받지 못했습니다. 다시 시도해 주세요.');
        }
      },
    });
    await Promise.race([chan.ready, new Promise((_, rej) => setTimeout(() => rej(new Error('중개 서버에 연결할 수 없습니다')), 10000))]);
    await chan.send({ t: 'ver', sid, ts: Date.now(), have });
    setTimeout(() => {
      if (done) return;
      done = true;
      chan.close();
      fail(device ? '호스트가 응답하지 않습니다. 호스트가 꺼져 있거나, 호스트에서 이 PC의 등록을 지웠을 수 있습니다. 지웠다면 PC 목록의 "키 바꾸기"로 접속 키를 다시 넣으면 다시 등록됩니다.'
        : '호스트가 응답하지 않습니다. 호스트 프로그램이 켜져 있는지와 접속 키를 확인하세요.');
    }, 15000);
  } catch (e) {
    done = true;
    if (chan) chan.close();
    fail('오류: ' + e.message);
  }
}

$('go').onclick = () => go();
$('key').addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
// A key in the slot where loaders before 2026-11-16 remembered one: the hand-over of a page that updated
// itself (#auto), or one an older loader kept. Used once and removed.
{ const k = store.get('mr_key'); if (k) { $('key').value = k; store.set('mr_key', null); } }
if (params.get('k')) { $('key').value = params.get('k'); try { history.replaceState(null, '', location.pathname); } catch {} }
// The client app gives a PC of its list that has a token of its own the token instead of the key.
const shell = window.mrShell && typeof window.mrShell.bootDevice === 'function' ? window.mrShell : null;
if (shell) {
  shell.bootDevice().then((d) => {
    if (!d || typeof d.secret !== 'string') { if (params.has('auto') && $('key').value) go(); return; }
    device = { id: String(d.id || ''), secret: d.secret, server: SERVER }; // the relay this loader is built for, always
    $('hint').textContent = '이 PC는 호스트에 기기로 등록되어 있어 키 없이 접속합니다.';
    $('key').style.display = 'none';
    $('go').textContent = '다시 연결';
    go();
  }, () => { if (params.has('auto') && $('key').value) go(); });
} else if (params.has('auto') && $('key').value) go();
})();
</script>
</body>
</html>
