<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Remote</title>
<style>
  html, body { height: 100%; margin: 0; background: #14171c; color: #e6e8eb; font: 14px/1.5 "Segoe UI", "Malgun Gothic", sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  .box { width: min(460px, 90vw); background: #1d2229; border: 1px solid #2c333d; border-radius: 10px; padding: 22px; }
  input[type=password] { width: 100%; box-sizing: border-box; font: 14px Consolas, monospace; padding: 8px; border-radius: 6px; border: 1px solid #3a4350; background: #0e1014; color: #fff; margin: 8px 0; }
  button { font: inherit; background: #2b6cff; color: #fff; border: 0; border-radius: 5px; padding: 8px 18px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #msg { color: #e0b341; min-height: 1.5em; margin-top: 8px; }
  small { color: #8b94a1; }
</style>
</head>
<body>
<div class="box">
  <h2 style="margin:0 0 6px">My Remote</h2>
  <small>호스트 프로그램에 표시된 접속 키를 입력하세요.</small>
  <input id="key" type="password" placeholder="접속 키" autocomplete="off" spellcheck="false">
  <label><input id="remember" type="checkbox"> <small>이 브라우저에 키 저장 (본인 전용 기기에서만)</small></label>
  <div style="margin-top:12px"><button id="go">접속</button></div>
  <div id="msg"></div>
</div>
<script>
// LOADER. This file is handed to a client PC once and is meant to stay unchanged.
// It only (1) asks for the access key, (2) asks the host - over the same
// encrypted, key-authenticated signaling channel used for connecting - for the
// current client page, and (3) runs that page. The client therefore always
// matches the version of the host it connects to.
//
// Bootstrap protocol (keep stable, old loaders are out there):
//   loader -> host: { t: 'ver', sid, ts, have: <hash of cached page or ''> }
//   host -> loader: { t: 'app', sid, ts, hash, html? }   html omitted when have === hash
// Everything is wrapped in a function so nothing here collides with the page it loads.
(() => {
/*__SIGNAL_JS__*/
const SERVER = '__SERVER__';
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch {} },
};
const preset = location.hash.slice(1) || '__PRESET__';
const params = new URLSearchParams(preset);
const msg = (s) => { $('msg').textContent = s; };
let busy = false;

function launch(html, key, updated) {
  // Replace this document with the client page. The window object is kept, so the page can read __mrBoot.
  window.__mrBoot = { key, remember: $('remember').checked, preset, updated };
  document.open();
  document.write(html);
  document.close();
}
// The host names its page by the first 20 hex digits of its SHA-256 (getClientApp in main.js).
// Fewer digits would be easy to match with a made-up page, so a shorter name is never trusted.
async function digest(html) {
  const d = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(html)));
  return Array.from(d, (x) => x.toString(16).padStart(2, '0')).join('');
}

// fresh: do not use the stored copy of the page.
async function go(fresh) {
  if (busy) return;
  const key = $('key').value.trim();
  store.set('mr_key', $('remember').checked ? key : null);
  let keys;
  try { keys = await RD.derive(key); } catch (e) { msg('오류: ' + e.message); return; }
  busy = true; $('go').disabled = true;
  const fail = (text) => { busy = false; $('go').disabled = false; msg(text); };
  const cached = fresh ? null : store.get('mr_app_html');
  const have = cached ? store.get('mr_app_hash') || '' : '';
  const sid = RD.rand(16);
  let done = false, chan = null;
  try {
    msg('호스트에 연결하는 중…');
    chan = RD.channel({
      server: SERVER, subTopic: keys.topicClient, pubTopic: keys.topicHost, rxKey: keys.h2c, txKey: keys.c2h,
      onMessage: async (m) => {
        if (done || !m || m.t !== 'app' || m.sid !== sid) return;
        done = true;
        chan.close();
        if (typeof m.html === 'string' && m.html.length > 1000) {
          store.set('mr_app_html', m.html);
          store.set('mr_app_hash', String(m.hash || ''));
          launch(m.html, key, true);
        } else if (cached && m.hash === have) {
          // Other local files opened in this browser can share this storage, so the stored copy may
          // not be the page it claims to be. It gets the key only when its own hash is the host's;
          // otherwise the page is fetched anew.
          let same = false;
          try { same = have.length >= 20 && (await digest(cached)).startsWith(have); } catch {}
          if (same) launch(cached, key, false);
          else { fail(''); go(true); }
        } else {
          fail('호스트에서 클라이언트 화면을 받지 못했습니다. 다시 시도해 주세요.');
        }
      },
    });
    await Promise.race([chan.ready, new Promise((_, rej) => setTimeout(() => rej(new Error('중개 서버에 연결할 수 없습니다')), 10000))]);
    await chan.send({ t: 'ver', sid, ts: Date.now(), have });
    setTimeout(() => {
      if (done) return;
      done = true;
      chan.close();
      fail('호스트가 응답하지 않습니다. 호스트 프로그램이 켜져 있는지와 접속 키를 확인하세요.');
    }, 15000);
  } catch (e) {
    done = true;
    if (chan) chan.close();
    fail('오류: ' + e.message);
  }
}

$('go').onclick = () => go();
$('key').addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
{ const k = store.get('mr_key'); if (k) { $('key').value = k; $('remember').checked = true; } }
if (params.get('k')) { $('key').value = params.get('k'); try { history.replaceState(null, '', location.pathname); } catch {} }
if (params.has('auto') && $('key').value) go();
})();
</script>
</body>
</html>
